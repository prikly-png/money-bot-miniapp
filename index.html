<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===========================================================================
   MONEY BOT — TELEGRAM MINI APP (FEAT-010, v1)

   МИР. Это не финтех-приложение, а личный леджер поверх Google-таблицы,
   которую владелец собрал сам. Отсюда бумага, чернила и линовка вместо
   карточек с тенями. Фонды здесь — не счета, а разметка поверх счетов
   (конверты), поэтому у них нет коробок: только линованные строки, как
   в бухгалтерской книге.

   ГЛУБИНА. Одна стратегия — волосяные линии, ни одной тени. Это бумага.
   Заодно снимает вечную проблему теней в тёмной теме.

   ТЕМА. Telegram решает, светло или темно; свои значения бумаги и чернил
   мы держим сами и подкрашиваем ПОД СЕБЯ хром телеграма (setBackgroundColor),
   а не наоборот. Иначе тёплая бумага утонула бы в нейтральном сером.
   =========================================================================== */

:root {
  /* Бумага и чернила — светлая тема */
  --paper:        #F4F1EA;   /* небелёная бухгалтерская бумага */
  --paper-sunk:   #EBE7DE;   /* углубление: то, что «вдавлено» в лист */
  --rule:         rgba(43, 41, 37, 0.10);   /* линовка */
  --rule-strong:  rgba(43, 41, 37, 0.18);   /* разделитель разделов */

  --ink:          #23211D;   /* основные чернила */
  --ink-soft:     rgba(35, 33, 29, 0.62);   /* подписи */
  --ink-faint:    rgba(35, 33, 29, 0.40);   /* метаданные */
  --ink-ghost:    rgba(35, 33, 29, 0.22);   /* шкала, засечки */

  --ledger:       #6E8A69;   /* зелёная линовка ledger-paper — «в норме» */
  --brick:        #A6503C;   /* красные чернила — минус, отставание */

  /* Шкала: 4px */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;

  --r-sm: 6px;  --r-md: 10px;

  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  /* Цифры — моноширинные намеренно: в бухгалтерии колонка чисел всегда
     моноширинная (лента арифмометра, графа леджера). Тёплая бумага вокруг
     не даёт этому читаться как терминал. */
  --font-num:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Roboto Mono", monospace;
}

:root.dark {
  --paper:        #1B1A18;
  --paper-sunk:   #211F1C;
  --rule:         rgba(238, 232, 220, 0.10);
  --rule-strong:  rgba(238, 232, 220, 0.16);

  --ink:          #EDE8DE;
  --ink-soft:     rgba(237, 232, 222, 0.60);
  --ink-faint:    rgba(237, 232, 222, 0.38);
  --ink-ghost:    rgba(237, 232, 222, 0.20);

  --ledger:       #8FAA89;   /* в тёмной десатурируем и осветляем */
  --brick:        #C2705A;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-wrap: pretty;
  /* Телеграм открывает вебвью поверх чата — резких скачков цвета быть не должно */
  transition: background-color 200ms cubic-bezier(0.23, 1, 0.32, 1);
}

body {
  padding:
    var(--s5)
    var(--s5)
    calc(var(--s8) + env(safe-area-inset-bottom, 0px));
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
}

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Разделитель разрядов. В моноширинном шрифте ЛЮБОЙ пробельный символ
   занимает полную ширину знака, и «$24 000» зияет дырой. Поэтому разделитель
   рисуем сами — пустой inline-block заданной ширины, независимо от шрифта. */
.gsep { display: inline-block; width: 0.3em; }

/* --- Шапка --------------------------------------------------------------- */

.head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
  margin-bottom: var(--s8);
}
.head-title {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.head-cycle { font-size: 11px; color: var(--ink-faint); }

/* --- Герой: сколько сегодня можно ---------------------------------------
   Один фокус на экран. Побеждает размером, весом и воздухом вокруг.
   Под ним — СОБСТВЕННАЯ АРИФМЕТИКА числа. В этом продукте дневной лимит
   не настройка, а следствие: Остаток ÷ дни до ЗП. Показать деление —
   значит объяснить, почему завтра число другое.
   ---------------------------------------------------------------------- */

.hero { margin-bottom: var(--s8); }

.hero-value {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 52px;
  font-weight: 600;
  letter-spacing: -0.035em;   /* оптический размер: крупное сжимаем */
  line-height: 1;
  display: block;
  /* Тап по числу переключает валюту показа. Отдельной кнопки нет намеренно:
     самая крупная валюта на экране — здесь, по ней и жмут. */
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 120ms ease;
}
.hero-value:active { opacity: 0.5; }
.hero-label {
  margin-top: var(--s3);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-soft);
}
.hero-math {
  margin-top: var(--s1);
  font-size: 12px;
  color: var(--ink-faint);
}

/* --- Шкала отклонения от плана -------------------------------------------
   НЕ прогресс-бар: залитого трека нет, «съеденной доли» нет. План — это
   ноль на оси, факт — засечка слева (жмёмся) или справа (идём с запасом).
   Так вопрос «отстаю или нет» читается без чтения чисел.
   ------------------------------------------------------------------------ */

.gauge { margin-top: var(--s6); }

.gauge-track {
  position: relative;
  height: 22px;
}
.gauge-line {
  position: absolute;
  top: 11px;
  left: 0; right: 0;
  height: 1px;
  background: var(--rule);
}
.gauge-zero {                 /* засечка плана */
  position: absolute;
  top: 3px;
  left: 50%;
  width: 1px;
  height: 17px;
  background: var(--ink-ghost);
  transform: translateX(-0.5px);
}
.gauge-mark {                 /* факт */
  position: absolute;
  top: 5px;
  width: 3px;
  height: 13px;
  border-radius: 1.5px;
  background: var(--ledger);
  transform: translateX(-1.5px);
  transition: left 320ms cubic-bezier(0.23, 1, 0.32, 1);
}
.gauge-mark.behind { background: var(--brick); }

/* Подписи стоят НАД и ПОД своими засечками, а не по краям строки:
   «план» по центру над своим тиком, отклонение — под маркером факта.
   Разные строки => пересечься не могут, и каждая подпись указывает на своё. */
.gauge-top, .gauge-bottom {
  position: relative;
  height: 15px;
  font-size: 11px;
  color: var(--ink-faint);
}
.gauge-plan, .gauge-delta {
  position: absolute;
  white-space: nowrap;
  transform: translateX(-50%);
  transition: left 320ms cubic-bezier(0.23, 1, 0.32, 1);
}
.gauge-plan { left: 50%; }
.gauge-delta { font-weight: 500; }
.gauge-delta.ahead  { color: var(--ledger); }
.gauge-delta.behind { color: var(--brick); }

/* --- Фонды: линованные строки, не карточки -------------------------------
   Порядок — ручной, по вниманию (см. FUND_PRIMARY в скрипте), а не по
   убыванию суммы: это его собственная раскладка по приоритетам,
   сортировать по числу = стереть смысл.

   Часть фондов уходит под разворот. Резервы (Депозит, Подушка) и «Мои»
   не решают вопрос «сколько сегодня можно» — на первом экране они только
   разбавляют четыре строки, ради которых экран открывают.
   ------------------------------------------------------------------------ */

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding-bottom: var(--s2);
  border-bottom: 1px solid var(--rule-strong);
  margin-bottom: var(--s1);
}
.section-title {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-soft);          /* глава не может быть тише своих строк */
}
/* Подпись «в чём» — она же переключатель валюты. Пунктир снизу: в мире бумаги
   так помечают сноску, к которой можно обратиться, и это не спорит с линовкой.

   Цель тапа расширена псевдоэлементом, а не паддингом: паддинг сбил бы
   выравнивание по базовой линии с заголовком «ФОНДЫ» в этой же флекс-строке. */
.section-note {
  position: relative;
  appearance: none;
  border: none;
  background: transparent;
  padding: 0 0 1px;
  font-family: inherit;
  font-size: 11px;
  color: var(--ink-faint);
  border-bottom: 1px dashed var(--ink-ghost);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color 120ms ease;
}
.section-note::after {
  content: '';
  position: absolute;
  inset: -14px -10px;         /* ≥44px по вертикали, layout не двигает */
}
.section-note:active { color: var(--ink-soft); }
.section-note:disabled {
  border-bottom-color: transparent;
  cursor: default;
}

.fund {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s4);
  min-height: 44px;
  padding: var(--s3) 0;
  border-bottom: 1px solid var(--rule);
}
.fund:last-child { border-bottom: none; }
.fund-name { font-size: 15px; font-weight: 400; }

/* Строка фонда — фильтр списка трат (FEAT-033). Своего вида у «нажимаемости»
   нет намеренно: подчёркивания и стрелки на семи строках подряд превратили бы
   тихую колонку в панель управления. Обратная связь — отклик на нажатие,
   а результат виден сразу под фондами. */
.fund[role="button"] {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 120ms ease;
}
.fund[role="button"]:active { opacity: 0.5; }

/* Выбранная строка фильтра — фонд ИЛИ категория (FEAT-038). Метка одна на
   обе: засечка на полях слева, как галочка карандашом на бумаге; заливкой
   строки пришлось бы вводить второй фон и спорить с линовкой. Фильтр на
   экране один, поэтому и засечка всегда одна — двух сразу не бывает. */
.fund.picked, .cat.picked, .cat-aside.picked { position: relative; }
.fund.picked::before, .cat.picked::before, .cat-aside.picked::before {
  content: '';
  position: absolute;
  left: -10px;
  top: 50%;
  width: 2px;
  height: 18px;
  margin-top: -9px;
  border-radius: 1px;
  background: var(--ink-soft);
}
.fund.picked .fund-name, .cat.picked .cat-name { font-weight: 500; }
.cat-aside.picked { color: var(--ink-soft); }
.fund-sum {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.fund-sum:active   { opacity: 0.5; }
.fund-sum.negative { color: var(--brick); }
.fund-sum.zero     { color: var(--ink-ghost); }
.fund-sum.masked   { color: var(--ink-faint); letter-spacing: 2px; }

/* Разворот. Строка того же роста, что и фонд, но тише чернилами: это не
   запись леджера, а корешок страницы. Суммы здесь намеренно нет — иначе
   строка читается как ещё один фонд, и разворачивать её незачем.
   Границы своей не имеет: сверху её рисует border-bottom последнего фонда.

   BUG-025: подпись+стрелка выровнены вправо, а не по всей ширине — под
   «показать/скрыть»/«в долларах» в шапке над блоком, большой палец не
   прыгает через экран. Тап-таргет всё равно на всю ширину (width: 100%). */
.fund-more {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--s4);
  width: 100%;
  min-height: 44px;
  padding: var(--s3) 0;
  appearance: none;
  border: none;
  background: transparent;
  color: var(--ink-faint);
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: color 120ms ease;
}
.fund-more:active { color: var(--ink-soft); }

.fund-caret {
  font-size: 10px;
  line-height: 1;
  transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1);
}
.fund-more[aria-expanded="true"] .fund-caret { transform: rotate(180deg); }

/* --- Категории за цикл (FEAT-036) ----------------------------------------
   Круговая диаграмма рассматривалась и отклонена: на 310px полезной ширины
   она требует легенды из 6-10 строк, то есть всё равно рисует список, а
   сегменты по 3-5% меньше 44px и не тапаются. Заливки шестью цветами ввели
   бы второй язык в макет, где нет ни одной тени. Здесь тот же приём, что
   в шкале отклонения: волосяная полоса чернилами по линовке.

   Период — зарплатный цикл, не календарный месяц: им живёт весь экран
   (дневной лимит, дни до ЗП, разделитель в списке трат). Два разных
   «периода» на одном экране расходились бы молча.
   ------------------------------------------------------------------------ */
.cat-section { margin-top: var(--s10); }

/* Раскрытый блок ложится в углубление листа (02.09.2026, по живому тесту v2.27).
   С тремя главами подряд экран читался сплошной лентой: заголовки тише строк,
   а линия под заголовком неотличима от линовки самих строк — взгляду не за что
   зацепиться при скролле.

   Подложка вместо новых линий: границы блока видны сразу и целиком, а линовка
   внутри остаётся единственным типом линии на экране. Цвет не новый —
   `--paper-sunk` уже держит поле ввода и служебные плашки.

   Поля растянуты за отступ страницы (`-s4` при `padding: --s5`): карман шире
   текста, но не упирается в край экрана, иначе скругления не видно. */
#catBody:not(.hidden),
#txBody:not(.hidden) {
  background: var(--paper-sunk);
  margin: 0 calc(-1 * var(--s4));
  padding: var(--s1) var(--s4) var(--s4);
  border-radius: var(--r-md);
}

/* Шапка блока: сумма за период крупно, рядом — на каком дне цикла она набрана.
   Без второго числа первое не значит ничего: $1 240 на 5-й день и на 28-й —
   разные новости. */
.cat-lead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
  padding: var(--s2) 0 var(--s3);
}
.cat-total {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 21px;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.cat-total.masked { color: var(--ink-faint); letter-spacing: 2px; }
.cat-day { font-size: 11px; color: var(--ink-faint); text-align: right; }

/* Дельта к тому же отрезку прошлого цикла. Именно к отрезку равной длины:
   сравнение с полным прошлым циклом на 12-й день показало бы «−58%» там,
   где идёт перерасход. Больше трат — красные чернила, меньше — зелёная
   линовка; те же два цвета, что на шкале отклонения наверху. */
.cat-vs {
  font-size: 11px;
  color: var(--ink-faint);
  padding-bottom: var(--s3);
  border-bottom: 1px solid var(--rule);
}
.cat-vs .up   { color: var(--brick);  font-weight: 500; }
.cat-vs .down { color: var(--ledger); font-weight: 500; }

/* Строка целиком — тап-таргет фильтра (FEAT-038). Сумма внутри остаётся своим
   таргетом маски: toggleAmountsMask гасит всплытие сам, ровно как в строке
   фонда. Цена промаха в обе стороны — один тап назад. */
.cat {
  padding: var(--s3) 0;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.cat:last-child { border-bottom: none; }

.cat-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
}
.cat-name {
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.cat-sum {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}
.cat-sum.masked { color: var(--ink-faint); letter-spacing: 2px; }
.cat-sum, .cat-total, .cat-aside-sum {
  cursor: pointer;                 /* любая скрытая сумма снимает маску (BUG-027) */
  -webkit-tap-highlight-color: transparent;
}
.cat-sum:active, .cat-total:active, .cat-aside-sum:active { opacity: 0.5; }

/* Полоса и проценты — одной строкой под именем: три строки на категорию
   растянули бы блок на пол-экрана. */
.cat-line {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-top: var(--s2);
}
.cat-bar {
  flex: 1;
  min-width: 0;
  height: 2px;                 /* волосяная линия, не столбик */
  background: var(--rule);
}
.cat-bar > i {
  display: block;
  height: 100%;
  background: var(--ink-soft);
}
.cat-share {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
  color: var(--ink-faint);
  min-width: 30px;
  text-align: right;
}
.cat-delta {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
  min-width: 46px;
  text-align: right;
}
.cat-delta.up   { color: var(--brick);  }
.cat-delta.down { color: var(--ledger); }
.cat-delta.flat { color: var(--ink-ghost); }

/* Хвост блока: фондовые траты и «Не определено». Обе строки — не категории,
   и стоять в общем ряду не должны. Фондовые в разбивку не входят вовсе
   (так же считает бот: Остаток = Счета − Фонды), поэтому без этой строки
   сумма блока молча не сошлась бы со списком трат под ним. */
.cat-aside {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
  margin-top: var(--s2);
  font-size: 12px;
  color: var(--ink-faint);
}
.cat-aside-sum {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}
.cat-aside.first { margin-top: var(--s4); }

/* Из двух строк хвоста тапается только «Без категории» — засечка ›  нужна
   затем, что рядом стоит внешне такая же строка, которая не тапается. */
.cat-aside.link { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.cat-aside.link:active { opacity: 0.5; }
.cat-aside-caret { color: var(--ink-ghost); margin-left: var(--s1); }

/* --- Последние траты (FEAT-033) ------------------------------------------
   Не «выписка по счёту», а память: куда ушло за последние дни. Поэтому здесь
   нет ни времени, ни источника, ни статуса — только мерчант и сумма, а дата
   вынесена в подзаголовок дня, одна на группу.

   Суммы — в валюте операции и БЕЗ пересчёта в валюту экрана: тап по валюте
   (FEAT-031) переключает фонды, где число и так оценка в долларах, а здесь
   сумма операции — факт. Знак ставим префиксом по той же причине, что у
   фондов: колонка выровнена вправо, суффикс разной ширины ($ vs ₾) рвал бы
   ряд цифр.

   Блок свёрнут по умолчанию и живёт ПОД фондами — экран открывают ради
   «сколько сегодня можно», а не ради истории.
   ------------------------------------------------------------------------ */

.tx-section { margin-top: var(--s10); }

.tx {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s4);
  min-height: 38px;          /* ниже фонда: строк много, и это не цель тапа */
  padding: var(--s2) 0;
  border-bottom: 1px solid var(--rule);
}
.tx:last-child { border-bottom: none; }

.tx-name {
  font-size: 14px;
  /* Имя мерчанта приходит из банка и бывает строкой-простынёй.
     Режем показом, а не данными: обрезать на бэкенде — значит решить за
     экран, сколько знаков влезет, не зная ширины телефона. */
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.tx-sum {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;                 /* сумма — тап-таргет маски (BUG-027) */
  -webkit-tap-highlight-color: transparent;
}
.tx-sum:active { opacity: 0.5; }
.tx-sum.masked { color: var(--ink-faint); letter-spacing: 2px; }

/* Метка фондовой траты. Такие траты не бьют по дневному бюджету, и без
   пометки «Аренда ₾1200» посреди списка искажает ощущение «сколько я
   потратил». Значок тот же, которым их помечает бот в списке «🏦 Последние». */
.tx-fund {
  margin-left: 6px;
  font-size: 11px;
  opacity: 0.55;
}

/* Чип активного фильтра (FEAT-038). Первая строка блока: чем отфильтровано,
   сколько это строк и — у категории — то самое число, по которому тапнули.
   Живёт ВНУТРИ блока, а не в его шапке: место справа в шапке занято
   «скрыть/показать», а после автоскролла шапка категорий уже за экраном,
   и подсветка строки там перестаёт работать выходом.

   Вид — служебная надпись на полях, как .tx-day, но с линией снизу: она
   отделяет контракт от строк, которые он описывает. */
.tx-chip {
  display: flex;
  align-items: baseline;
  gap: var(--s2);
  padding: var(--s2) 0 var(--s3);
  border-bottom: 1px solid var(--rule-strong);
  font-size: 11px;
  color: var(--ink-faint);
}
.tx-chip-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tx-chip-sum {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  cursor: pointer;                 /* та же маска, что у сумм категорий */
  -webkit-tap-highlight-color: transparent;
}
.tx-chip-sum:active { opacity: 0.5; }
.tx-chip-sum.masked { color: var(--ink-faint); letter-spacing: 2px; }

/* Крестик — кнопка, а не глиф: у него своя область нажатия, иначе на 11px
   в него не попасть. Поля растянуты вбок и вниз, а не размером шрифта. */
.tx-chip-clear {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-faint);
  font-family: inherit;
  font-size: 13px;
  line-height: 1;
  padding: var(--s1) 0 var(--s1) var(--s3);
  margin: calc(-1 * var(--s1)) 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tx-chip-clear:active { opacity: 0.5; }

/* Подзаголовок дня. Ведёт себя как надпись на полях: мельче строк, тише
   чернилами, без линовки — иначе спорит с границами самих строк. */
.tx-day {
  margin: var(--s4) 0 var(--s1);
  font-size: 11px;
  color: var(--ink-faint);
}
.tx-day:first-child { margin-top: var(--s2); }

/* Граница зарплатного цикла. Не «фильтр», а отметка на полях: всё, что выше,
   потрачено в текущем цикле — том самом, из которого считается дневной лимит
   наверху экрана. Линия сильнее обычной линовки, подпись справа мелко. */
.tx-cycle {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin: var(--s5) 0 var(--s2);
  font-size: 11px;
  color: var(--ink-faint);
}
.tx-cycle::before {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--rule-strong);
}

/* Служебные строки блока: «Загружаю», «трат нет», отказ загрузки. Ростом
   с обычную строку, чтобы блок не прыгал при смене состояния. */
.tx-state {
  padding: var(--s3) 0;
  font-size: 13px;
  color: var(--ink-faint);
}
.tx-state .btn { margin-top: var(--s3); }

/* Сноска о неполноте. В !Транзакции попадает не всё: наличные без ручного
   ввода и медицина через страховую проходят мимо. Без оговорки список
   читается как «всё, что было со счетами», и не сходится с балансом. */
.tx-note {
  margin-top: var(--s3);
  font-size: 11px;
  line-height: 1.45;
  color: var(--ink-ghost);
}

/* --- Подвал -------------------------------------------------------------- */

.foot {
  margin-top: var(--s8);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
}
.foot-stamp { font-size: 11px; color: var(--ink-faint); }

.btn {
  appearance: none;
  border: 1px solid var(--rule-strong);
  background: transparent;
  color: var(--ink-soft);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  /* Оптическое выравнивание: слева чуть меньше из-за глифа обновления */
  padding: 9px 14px 9px 12px;
  border-radius: var(--r-sm);
  min-height: 40px;
  cursor: pointer;
  transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1),
              border-color 120ms ease,
              color 120ms ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }

/* --- Состояния ------------------------------------------------------------
   BUG-009 (дашборд): сообщение об ошибке НЕЛЬЗЯ писать в контейнер, где
   лежит форма ввода URL — оно затирает форму, и чинить становится нечем.
   Поэтому #errorBlock живёт отдельно и ничего не затирает.
   ------------------------------------------------------------------------ */

#content { animation: rise 200ms cubic-bezier(0.23, 1, 0.32, 1) both; }
@keyframes rise {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}
#content.stale { opacity: 0.45; transition: opacity 160ms ease; }

.notice {
  border: 1px solid var(--rule-strong);
  border-radius: var(--r-md);
  padding: var(--s4);
  margin-bottom: var(--s5);
  background: var(--paper-sunk);
}
.notice-title { font-size: 14px; font-weight: 600; margin-bottom: var(--s1); }
.notice-body  { font-size: 13px; color: var(--ink-soft); }
.notice-body code {
  font-family: var(--font-num);
  font-size: 12px;
  background: var(--rule);
  padding: 1px 5px;
  border-radius: 4px;
}
.notice-body p { margin: var(--s2) 0 0; }
.notice.alarm { border-color: var(--brick); }
.notice.alarm .notice-title { color: var(--brick); }

.setup-input {
  width: 100%;
  margin-top: var(--s3);
  padding: 10px var(--s3);
  min-height: 44px;
  font-family: var(--font-num);
  font-size: 12px;
  color: var(--ink);
  background: var(--paper-sunk);      /* поле «вдавлено», а не приподнято */
  border: 1px solid var(--rule-strong);
  border-radius: var(--r-sm);
}
.setup-input:focus {
  outline: none;
  border-color: var(--ink-faint);
}

.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- Ошибки живут ОТДЕЛЬНО от содержимого и от формы настройки (BUG-009) -->
<div id="errorBlock" class="hidden"></div>
<div id="setupBlock" class="hidden"></div>

<div id="content" class="hidden">
  <header class="head">
    <span class="head-title">Бюджет</span>
    <span class="head-cycle" id="cycle"></span>
  </header>

  <section class="hero">
    <span class="hero-value num" id="perDay" role="button" tabindex="0">—</span>
    <div class="hero-label">доступно в день</div>
    <div class="hero-math" id="math"></div>

    <div class="gauge" id="gauge">
      <div class="gauge-top">
        <span class="gauge-plan" id="gaugePlan"></span>
      </div>
      <div class="gauge-track">
        <div class="gauge-line"></div>
        <div class="gauge-zero"></div>
        <div class="gauge-mark" id="gaugeMark" style="left:50%"></div>
      </div>
      <div class="gauge-bottom">
        <span class="gauge-delta" id="gaugeDelta"></span>
      </div>
    </div>
  </section>

  <section>
    <div class="section-head">
      <span class="section-title">Фонды</span>
      <button class="section-note" id="curNote" type="button">в долларах</button>
    </div>
    <div id="funds"></div>
  </section>

  <!-- FEAT-036: траты по категориям за текущий зарплатный цикл. Стоит МЕЖДУ
       фондами и списком трат: категории — обобщение, список — детализация
       того же периода. Данные приходят тем же запросом part=tx, что и список,
       поэтому состояние загрузки у блоков общее. -->
  <section class="cat-section">
    <div class="section-head">
      <span class="section-title" id="catTitle">Категории</span>
      <button class="section-note" id="catToggle" type="button">показать</button>
    </div>
    <div id="catBody" class="hidden"></div>
  </section>

  <!-- FEAT-033: последние траты. Свёрнуто по умолчанию; подпись справа —
       она же переключатель, она же индикатор загрузки и отказа. -->
  <section class="tx-section" id="txSection">
    <div class="section-head">
      <span class="section-title" id="txTitle">Последние траты</span>
      <button class="section-note" id="txToggle" type="button">показать</button>
    </div>
    <div id="txBody" class="hidden"></div>
  </section>

  <footer class="foot">
    <span class="foot-stamp" id="stamp"></span>
    <button class="btn" id="refresh" type="button">↻ Обновить</button>
  </footer>
</div>

<script>
/* ===========================================================================
   Money Bot Mini App — клиент

   Данные берём из Apps Script через JSONP (как expense_dashboard.html):
   обычный fetch упрётся в CORS, а тег <script> — нет.

   Авторизация — подпись Telegram (initData), НЕ общий ключ: страница
   статическая и лежит на публичном хостинге, ключ утёк бы в исходник.
   Проверку делает phase16_miniapp.js на стороне Apps Script.
   =========================================================================== */

var API_URL_PLACEHOLDER = '__PASTE_WEB_APP_URL__';

/* Адрес веб-приложения Apps Script. Пока не прошит — берём из localStorage,
   куда его кладёт форма настройки ниже. */
var API_URL = API_URL_PLACEHOLDER;

var LS_URL   = 'miniapp_api_url';
var LS_CACHE = 'miniapp_last_payload';

var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

/* --- Тема ----------------------------------------------------------------
   Telegram решает светло/темно, значения бумаги и чернил — наши.
   Хром телеграма подкрашиваем ПОД страницу, а не наоборот. */
function applyTheme() {
  var dark = tg ? (tg.colorScheme === 'dark')
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', dark);

  if (tg) {
    var paper = getComputedStyle(document.documentElement)
                  .getPropertyValue('--paper').trim();
    try { tg.setBackgroundColor(paper); } catch (e) {}
    try { tg.setHeaderColor(paper); } catch (e) {}
  }
}

/* --- Форматирование ------------------------------------------------------- */

var MINUS = '−';   /* U+2212, а не дефис: у типографского минуса своя ширина */

/* --- Валюта экрана --------------------------------------------------------
   Числа с бэкенда ВСЕГДА в долларах — доллар здесь базовая валюта учёта.
   Тап переключает только ПОКАЗ: $ → € → ₽ → $. Никакой арифметики бюджета
   это не трогает, шкала и остаток считаются в долларах и конвертируются
   в последний момент, при выводе.

   Курсы приходят из строки 26 главного листа — те же, которыми лист считает
   ИТОГ$. Свои брать неоткуда и не нужно: иначе экран показывал бы не то,
   что таблица.

   Знак ставим ПРЕФИКСОМ у всех трёх, включая рубль. По-русски привычнее
   «4 564 ₽», но колонка фондов выровнена по правому краю: суффикс сдвигал бы
   цифры на ширину знака, и ровная колонка развалилась бы при каждом тапе.

   Выбор НЕ запоминается между открытиями — экран всегда открывается
   в долларах. Иначе через месяц рублёвое число читалось бы как долларовое. */
var CURRENCIES = [
  { code: 'USD', sign: '$', note: 'в долларах' },
  { code: 'EUR', sign: '€', note: 'в евро'     },
  { code: 'RUB', sign: '₽', note: 'в рублях'   }
];

var curRates = { USD: 1 };
var curCycle = [CURRENCIES[0]];
var curIdx   = 0;

function activeCur() { return curCycle[curIdx]; }

/* Валюта без курса в цикл НЕ попадает.
   Подставить единицу вместо пустого курса — значит показать долларовые числа
   со значком евро: молча и уверенно неверно. Пусть лучше валюты не будет. */
function setRates(rates) {
  curRates = { USD: 1 };
  CURRENCIES.forEach(function (c) {
    if (c.code === 'USD') return;
    var r = Number(rates && rates[c.code]);
    if (isFinite(r) && r > 0) curRates[c.code] = r;
  });
  curCycle = CURRENCIES.filter(function (c) { return curRates[c.code]; });
  if (curIdx >= curCycle.length) curIdx = 0;
}

function toActive(usd) {
  return (Number(usd) || 0) * curRates[activeCur().code];
}

/* Текстовый вариант — для подписей обычным шрифтом. */
function money(n) {
  var v = Math.round(toActive(n));
  return (v < 0 ? MINUS : '') + activeCur().sign + Math.abs(v).toLocaleString('ru-RU');
}

/* Вариант для моноширинных мест: разделитель разрядов рисуем сами (.gsep),
   иначе он занимает полную ширину знака и число зияет дырой.
   Внутри только цифры и наша разметка — чужих строк здесь не бывает. */
function moneyHtml(n) {
  var v = Math.round(toActive(n));
  var body = Math.abs(v).toLocaleString('ru-RU')
               .replace(/[    ]/g, '<i class="gsep"></i>');
  return (v < 0 ? MINUS : '') + activeCur().sign + body;
}

function plural(n, one, few, many) {
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5)   return few;
  if (b === 1)          return one;
  return many;
}

function timeStamp(iso) {
  var d = iso ? new Date(iso) : new Date();
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

/* --- Отрисовка ------------------------------------------------------------ */

/* Последнее показанное — чтобы тап по валюте перерисовал экран, не ходя
   заново в сеть: конвертация целиком на клиенте, данные те же. */
var lastData = null, lastStale = false;

function render(data, isStale) {
  lastData  = data;
  lastStale = !!isStale;
  setRates(data.rates);

  var content = document.getElementById('content');
  content.classList.remove('hidden');
  content.classList.toggle('stale', !!isStale);

  var days = Number(data.daysLeft) || 0;
  document.getElementById('cycle').textContent =
    days > 0 ? days + ' ' + plural(days, 'день', 'дня', 'дней') + ' до зарплаты' : '';

  document.getElementById('perDay').innerHTML = moneyHtml(data.perDay);

  /* Арифметика числа — подпись продукта: видно, ОТКУДА взялся лимит */
  var math = document.getElementById('math');
  math.textContent = days > 0
    ? money(data.remainder) + ' остатка ÷ ' + days + ' ' + plural(days, 'день', 'дня', 'дней')
    : money(data.remainder) + ' остатка';

  renderGauge(Number(data.perDay) || 0, Number(data.planPerDay) || 0);
  renderFunds(data.funds || []);
  renderCurNote();
  renderTx();   /* сам список от валюты экрана не зависит — перерисовываем ради
                   заголовка с фильтром и подписи «показать/скрыть» */
  renderCats(); /* а вот суммы категорий — в валюте экрана, их пересчитать надо */

  document.getElementById('stamp').textContent =
    (isStale ? 'из памяти · ' : 'обновлено ') + timeStamp(data.updatedAt);
}

/* Подпись у заголовка «Фонды» — она же переключатель и она же ответ на
   вопрос «а это сейчас в чём». Пунктир говорит, что по ней можно нажать;
   когда переключать не на что (курсов не пришло), пунктир снимается —
   мёртвая на вид кнопка честнее живой на вид, но неработающей. */
function renderCurNote() {
  var note = document.getElementById('curNote');
  var only = curCycle.length < 2;
  note.textContent = activeCur().note;
  note.disabled = only;
  note.setAttribute('title', only ? 'Курсы не пришли — переключать не на что' : '');
}

function cycleCurrency() {
  if (curCycle.length < 2 || !lastData) return;
  curIdx = (curIdx + 1) % curCycle.length;
  render(lastData, lastStale);
  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
  }
}

/* Шкала отклонения: план — ноль в центре, факт — засечка слева или справа.
   Отклонение прижимаем к ±50% плана, чтобы засечка не улетала за край,
   а подпись под ней — к 12..88%, чтобы не обрезалась о край экрана. */
function renderGauge(fact, plan) {
  var gauge = document.getElementById('gauge');
  if (!plan) { gauge.classList.add('hidden'); return; }
  gauge.classList.remove('hidden');

  var delta  = fact - plan;
  var ratio  = Math.max(-0.5, Math.min(0.5, delta / plan));
  var markPc = 50 + ratio * 100;
  var behind = delta < 0;

  var mark = document.getElementById('gaugeMark');
  mark.style.left = markPc + '%';
  mark.classList.toggle('behind', behind);

  document.getElementById('gaugePlan').textContent = 'план ' + money(plan);

  var d = document.getElementById('gaugeDelta');
  if (Math.abs(delta) < 1) {
    d.textContent = 'ровно по плану';
    d.className = 'gauge-delta';
    d.style.left = '50%';
  } else {
    d.textContent = (behind ? MINUS : '+') + money(Math.abs(delta)).replace(MINUS, '');
    d.className = 'gauge-delta ' + (behind ? 'behind' : 'ahead');
    d.style.left = Math.max(12, Math.min(88, markPc)) + '%';
  }
}

/* --- Раскладка фондов -----------------------------------------------------
   Порядок на экране — СВОЙ, не табличный. В таблице строки 13–22 стоят так,
   как удобно формулам; здесь нужен порядок по вниманию: сначала то, из чего
   тратят в этом месяце.

   Списки живут на странице, а не в Apps Script, намеренно. Это экранная
   раскладка: она меняется вместе с приоритетами (раз в месяц-два), и менять
   её не должно стоить редеплоя веб-приложения — достаточно deploy_miniapp.sh.
   В Apps Script остаётся только СМЫСЛОВОЕ отсеивание (MINIAPP_HIDDEN_FUNDS):
   «Тани» — транзитный карман, «Страховая» — клиринг долга, они не фонды
   вообще. «Квартира» же — обычный фонд, просто сейчас не нужна на глазах,
   и это решение экрана, а не модели данных.                                 */
var FUND_PRIMARY   = ['Отпуск', 'Техника', 'Бадди', 'Мама'];
var FUND_SECONDARY = ['Мои', 'Депозит', 'Подушка'];
var FUND_HIDDEN    = ['Квартира'];

/* Разворот держим в памяти страницы: «Обновить» не должен схлопывать то,
   что человек только что открыл. Между запусками не помним — экран
   открывают ради первых четырёх строк. */
var fundsExpanded = false;

/* Скрытие сумм по тапу. Решение пользователя, дважды уточнённое живыми
   тестами:
   - 24.08.2026 (FEAT-034): либо скрыты ВСЕ фонды, либо ни одного — по одному
     не имеет смысла, соседние строки всё равно выдают порядок величины;
   - 02.09.2026 (BUG-027): маска накрывает ВСЕ суммы экрана, кроме дневного
     лимита. Пока под ней были только фонды и категории, экран выглядел
     сломанным: точки в двух блоках и открытые суммы трат в третьем.

   Дневной лимит и его арифметика остаются видны намеренно. Это не размер
   капитала, а «сколько можно сегодня» — ради него экран и открывают,
   в том числе при людях. Плюс тап по герою остаётся переключателем валюты
   (FEAT-031) и не превращается в жест с двумя смыслами.

   Открыл мини-апп — суммы видны, спрятал на время чужого взгляда — сам
   вернул; между запусками НЕ помним, тем же приёмом, что fundsExpanded
   и выбор валюты. */
var amountsMasked = false;

/* Любая скрытая сумма — тап-таргет снятия (BUG-027). Раньше маска снималась
   только через фонды: человек смотрел на «••••» рядом с категорией, жал,
   и ничего не происходило — приходилось скроллить вверх. Скрытая сумма
   выглядит одинаково везде, значит и вести себя обязана одинаково.

   stopPropagation обязателен: под суммой фонда лежит фильтр списка трат
   (FEAT-033), клик утёк бы в него. */
function toggleAmountsMask(ev) {
  if (ev) ev.stopPropagation();
  amountsMasked = !amountsMasked;
  renderFunds(lastData && lastData.funds ? lastData.funds : []);
  renderCats();
  renderTx();
  haptic();
}

function fundKey(name) { return String(name || '').trim().toLowerCase(); }

function arrangeFunds(funds) {
  var byKey = {};
  funds.forEach(function (f) { byKey[fundKey(f.name)] = f; });

  var used = {};
  function take(names) {
    var out = [];
    names.forEach(function (n) {
      var k = fundKey(n);
      if (byKey[k]) { out.push(byKey[k]); used[k] = true; }
    });
    return out;
  }

  var top  = take(FUND_PRIMARY);
  var rest = take(FUND_SECONDARY);
  FUND_HIDDEN.forEach(function (n) { used[fundKey(n)] = true; });

  /* Фонд, которого нет ни в одном списке, — новая строка в таблице.
     Кладём его в разворот, а не прячем: лишняя строка видна сразу,
     пропавшее число ищут долго. */
  funds.forEach(function (f) {
    if (!used[fundKey(f.name)]) rest.push(f);
  });

  return { top: top, rest: rest };
}

/* Рисует сумму фонда с учётом общей маски — общая точка и для первой
   отрисовки, и для перерисовки по тапу, иначе состояния разошлись бы. */
function paintFundSum(sum, f) {
  sum.className = 'fund-sum' + (amountsMasked ? ' masked' : (f.usd < 0 ? ' negative' : (!f.usd ? ' zero' : '')));
  if (amountsMasked) sum.textContent = '••••';
  else             sum.innerHTML = moneyHtml(f.usd);
}

function fundRow(f) {
  var row = document.createElement('div');
  row.className = 'fund' +
    (txFilter && txFilter.kind === 'fund' && txFilter.value === f.name ? ' picked' : '');
  row.setAttribute('data-key', f.name);   /* якорь доводки, см. filterAnchorEl_ */

  /* FEAT-033: строка фонда фильтрует список трат под фондами. Верх экрана
     тап не трогает: perDay и шкала считаются по циклу целиком, и дёргать их
     от фильтра значило бы показать «дневной лимит фонда», которого нет. */
  row.setAttribute('role', 'button');
  row.tabIndex = 0;
  row.addEventListener('click', function () { pickTxFilter('fund', f.name); });
  row.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pickTxFilter('fund', f.name); }
  });

  var name = document.createElement('span');
  name.className = 'fund-name';
  name.textContent = f.name;            /* имя из таблицы — только textContent */

  /* Скрытие суммы — свой тап-таргет, не ряд целиком: имя уже занято фильтром
     (FEAT-033) выше. stopPropagation обязателен, иначе один тап по сумме
     ещё и переключал бы фильтр под ней. Тап по ЛЮБОЙ сумме переключает ВСЕ —
     флаг общий, поэтому перерисовываем весь список, а не один узел. */
  var sum = document.createElement('span');
  paintFundSum(sum, f);
  sum.addEventListener('click', toggleAmountsMask);

  row.appendChild(name);
  row.appendChild(sum);
  return row;
}

function renderFunds(funds) {
  var box = document.getElementById('funds');
  box.textContent = '';

  var split = arrangeFunds(funds || []);

  if (!split.top.length && !split.rest.length) {
    var empty = document.createElement('div');
    empty.className = 'fund';
    var msg = document.createElement('span');
    msg.className = 'fund-name';
    msg.style.color = 'var(--ink-faint)';
    msg.textContent = 'Фондов нет';
    empty.appendChild(msg);
    box.appendChild(empty);
    return;
  }

  split.top.forEach(function (f) { box.appendChild(fundRow(f)); });

  if (!split.rest.length) return;

  /* Свёрнутые строки строим сразу и прячем классом, а не пересобираем по
     клику: пересборка теряет фокус на кнопке и роняет анимацию стрелки. */
  var more = document.createElement('div');
  split.rest.forEach(function (f) { more.appendChild(fundRow(f)); });

  var label = document.createElement('span');
  label.textContent = 'Ещё ' + split.rest.length + ' ' +
    plural(split.rest.length, 'фонд', 'фонда', 'фондов');

  var caret = document.createElement('span');
  caret.className = 'fund-caret';
  caret.textContent = '▾';

  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'fund-more';
  btn.appendChild(label);
  btn.appendChild(caret);

  function sync() {
    btn.setAttribute('aria-expanded', fundsExpanded ? 'true' : 'false');
    more.className = fundsExpanded ? '' : 'hidden';
  }
  sync();

  btn.addEventListener('click', function () {
    fundsExpanded = !fundsExpanded;
    sync();
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    }
  });

  box.appendChild(btn);
  box.appendChild(more);
}

/* --- Последние траты (FEAT-033) -------------------------------------------
   Задача блока — память: куда ушли деньги за последние дни. Не сверка
   («правильно ли бот записал» — там нужны время и источник) и не правка
   («повесить фонд задним числом» — это живёт в боте, FEAT-022). Экран
   остаётся read-only.

   Окно НЕ равно видимому: с бэкенда приходит 200 трат, показываем 10.
   Так фильтр по фонду работает мгновенно и на клиенте — иначе каждый тап
   стоил бы похода в Apps Script, а по редкому фонду короткое окно дало бы
   одну запись и соврало бы «трат не было».                                 */

var TX_FIRST = 10;   /* сколько строк видно сразу */
var TX_STEP  = 10;   /* сколько добавляет «Ещё» */

/* Фонды, из которых не тратят вообще: Депозит и Подушка — резервы, бот
   в них только откладывает. Пустой список по ним — не «данных нет», а «здесь
   трат не бывает», и сказать это надо словами, иначе пустота читается сбоем.
   Источник истины — SPEND_FUNDS в phase6_fund.js; здесь список продублирован
   осознанно, как FUND_PRIMARY выше: это текст экрана, а не модель. */
var TX_NEVER_SPENT = ['Депозит', 'Подушка'];

var TX_SIGN = { USD: '$', EUR: '€', RUB: '₽', GEL: '₾', KZT: '₸' };

var txState      = 'idle';   /* idle | loading | ready | error */
var txItems      = [];
var txCycleStart = 0;
var txErrorText  = '';
var txSlow       = false;   /* загрузка затянулась — сказать об этом словами */
var txExpanded   = false;
var txShown      = TX_FIRST;
/* Фильтр списка ОДИН на экран: { kind: 'fund' | 'cat', value: '…' } либо null.
   Двух независимых не бывает намеренно (FEAT-038): фондовые траты вырезаны
   из разбивки ЦИКЛА ещё на бэкенде, значит «Продукты (за цикл) + Отпуск» = ∅
   по построению. Одно поле состояния — и сброс тоже один.

   BUG-031: у фильтра по фонду есть УТОЧНЕНИЕ категорией — { kind: 'fund',
   value: 'Отпуск', cat: 'Кафе' }. Это не второй фильтр, а сужение первого:
   блок категорий при выбранном фонде показывает разбивку ЭТОГО фонда (из тех
   же строк, что в списке), и тап по её строке сужает список до «фонд +
   категория». Пусто тут быть не может — строка в разбивке есть ровно потому,
   что такие траты в списке лежат. Крестик снимает всё разом. */
var txFilter     = null;
var txRefocus    = false;    /* вернуть фокус на «Ещё» после дорисовки */

/* Категория с засечкой: либо сам фильтр по категории, либо уточнение внутри
   фильтра по фонду. Одна точка — иначе строки блока проверяли бы два поля
   каждая по-своему. */
function pickedCat(filter) {
  if (!filter) return null;
  if (filter.kind === 'cat') return filter.value;
  return filter.cat || null;
}

/* --- Чистые помощники (покрыты test_miniapp_tx.js) --- */

/* Незнакомый код валюты показываем кодом, а не подставляем доллар:
   «$250» вместо «250 DKK» — молча и уверенно неверно. FX-слой (FEAT-025)
   позволяет тратить в любой валюте, справочник !Курсы правится без деплоя,
   и новый код доедет сюда раньше, чем эта таблица.

   Отбивку от числа знак НЕ несёт: в моноширинном шрифте пробел занимает
   полную ширину знака, и «DKK 85» зияет дырой. Щель рисует .gsep в разметке. */
function txSign(code) {
  var c = String(code || '').toUpperCase();
  return TX_SIGN[c] || c;
}

/* Суммы целые: экран про «куда ушло», а не про сверку до цента. Исключение —
   траты меньше единицы валюты: округление показало бы «₾0», то есть трату,
   которой как будто не было. */
function txAmountText(n) {
  var v = Number(n) || 0;
  if (v !== 0 && Math.abs(v) < 1) return String(v.toFixed(1)).replace('.', ',');
  return Math.round(v).toLocaleString('ru-RU');
}

/* Разделитель разрядов рисуем сами, как в moneyHtml: в моноширинном шрифте
   любой пробельный символ занимает полную ширину знака, и «₾1 200» зияет
   дырой. Внутри только наши цифры и наша разметка — чужих строк не бывает,
   знак валюты приклеивается отдельным текстовым узлом. */
function txAmountHtml(n) {
  return txAmountText(n).replace(/[   ]/g, '<i class="gsep"></i>');
}

function txDayStamp(ts) {
  var d = new Date(ts);
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

/* Месяцы своей таблицей, а не toLocaleDateString: движки расходятся в том,
   что считать сокращением. WebKit (вебвью Telegram) на июле отдаёт полное
   «24 июля», а на августе сокращённое «21 авг» — на одном экране это читается
   как небрежность. Заодно исчезает разница между тем, что видит браузер
   на телефоне, и тем, что проверяет Node в тестах. */
var TX_MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн',
                 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

function txShortDate(ts) {
  var d = new Date(ts);
  return d.getDate() + ' ' + TX_MONTHS[d.getMonth()];
}

/* «Вчера» считаем сдвигом календарного дня, а не вычитанием суток в
   миллисекундах: в поездке (Копенгаген) перевод часов сделал бы вчерашний
   день позавчерашним на один день в году. */
function txDayLabel(ts, nowTs) {
  if (!ts) return 'без даты';
  var day = txDayStamp(ts);
  if (day === txDayStamp(nowTs)) return 'Сегодня';

  var y = new Date(nowTs);
  y.setDate(y.getDate() - 1);
  if (day === txDayStamp(y.getTime())) return 'Вчера';

  return txShortDate(ts);
}

/* Индекс первой траты ПРОШЛОГО цикла — там и рисуем границу. −1 = все
   показанные траты из текущего цикла, границы в окне нет. */
function txCycleSplit(items, cycleStart) {
  if (!cycleStart) return -1;
  for (var i = 0; i < items.length; i++) {
    if (items[i].ts && items[i].ts < cycleStart) return i;
  }
  return -1;
}

/* Фильтрация списка. У двух видов фильтра РАЗНЫЕ окна, и это главное в фиче.

   Фонд — как было: весь загруженный хвост, цикл не важен. Человек спрашивает
   «что я вообще брал из Отпуска», у этого вопроса нет границы по дате.

   Категория — состав того числа, по которому тапнули: текущий цикл, без
   фондовых, эта категория. Ровно то множество, из которого блок разбивки
   сложил свои $340 (miniAppAggregateCats_ в phase16_miniapp.js). Показать
   здесь весь хвост значило бы дать список, который с числом над ним не
   сходится никогда и объясняется только простынёй оговорок.

   Фонд + категория (BUG-031) — окно фонда, суженное категорией: та же
   разбивка фонда над списком считается из этих же строк (catFundItems). */
function txFilterItems(items, filter, cycleStart) {
  if (!filter) return items;

  if (filter.kind === 'fund') {
    return items.filter(function (it) {
      if (it.fund !== filter.value) return false;
      return !filter.cat || it.cat === filter.cat;
    });
  }

  return items.filter(function (it) {
    if (it.fund) return false;                              /* фондовых в разбивке нет */
    if (cycleStart && !(it.ts >= cycleStart)) return false; /* только текущий цикл */
    return it.cat === filter.value;
  });
}

/* Дотянулось ли окно списка до начала цикла. Доказательство одно: самая
   старая загруженная трата СТАРШЕ начала цикла — значит всё, что после неё,
   в выборке есть. Записи идут от свежих к старым, поэтому смотрим последнюю.

   Без этой проверки чип обещал бы «12 трат» там, где список физически знает
   девять, — то же враньё с уверенным лицом, от которого на бэкенде стоит
   флаг truncated. */
function txWindowCoversCycle(items, cycleStart) {
  if (!cycleStart || !items || !items.length) return false;
  var oldest = items[items.length - 1];
  return !!(oldest && oldest.ts && oldest.ts < cycleStart);
}

/* Текст чипа. Число трат обещаем только когда окно доказано полным. */
function txChipText(filter, count, covers) {
  if (!filter) return '';
  var n = count + ' ' + plural(count, 'трата', 'траты', 'трат');
  if (filter.kind === 'fund') {
    return filter.value + (filter.cat ? ' · ' + filter.cat : '') + ' · из фонда · ' + n;
  }
  if (!covers)                return filter.value + ' · за цикл · в списке не все';

  /* «0 трат» рядом с суммой $40 — противоречие в одной строке. Счёт молчит,
     причину объясняет сообщение под чипом. */
  if (!count) return filter.value + ' · за цикл';
  return filter.value + ' · за цикл · ' + n;
}

/* Пустой результат обязан называть причину. «Ничего нет» здесь почти всегда
   ложь: по категории пустота логически невозможна — раз строка в разбивке
   есть, траты в цикле были, и единственная причина пустоты — окно списка
   до них не достало. Прецедент тот же, что у «Депозита» ниже. */
function txEmptyText(filter, covers) {
  if (!filter) return 'Пока пусто.';

  if (filter.kind === 'fund') {
    if (filter.cat) return 'По этой категории из фонда среди последних трат ничего нет.';
    return TX_NEVER_SPENT.indexOf(filter.value) !== -1
      ? 'Из этого фонда не тратим — он на сбережения.'
      : 'Среди последних трат по этому фонду ничего нет.';
  }

  return covers
    ? 'Траты этой категории в цикле есть, но в список они не попали.'
    : 'Эти траты старше окна списка — в последних загруженных записях их нет.';
}

/* --- Отрисовка блока --- */

function txRowNode(it) {
  var row = document.createElement('div');
  row.className = 'tx';

  var name = document.createElement('span');
  name.className = 'tx-name';
  name.textContent = it.merchant || '—';   /* строка от банка — только textContent */

  /* Метку ставим только в общем списке: когда фильтр уже по фонду,
     она стоит у каждой строки и не значит ничего. */
  if (it.fund && !(txFilter && txFilter.kind === 'fund')) {
    var mark = document.createElement('span');
    mark.className = 'tx-fund';
    mark.textContent = '🏦';
    mark.title = it.fund;
    name.appendChild(mark);
  }

  /* Знак валюты — текстовым узлом, число — разметкой: код валюты приходит
     из таблицы, и склеивать его с HTML незачем. */
  var sum = document.createElement('span');
  sum.className = 'tx-sum num' + (amountsMasked ? ' masked' : '');
  sum.addEventListener('click', toggleAmountsMask);

  /* BUG-027: под маской знак валюты тоже уходит. Оставить «₾••••» значило бы
     показать, в какой стране человек платил, — это та же приватность. */
  if (amountsMasked) {
    sum.textContent = '••••';
    row.appendChild(name);
    row.appendChild(sum);
    return row;
  }

  var sign = txSign(it.currency);
  sum.appendChild(document.createTextNode(sign));

  /* Односимвольный знак ($, ₾) прижимается к числу вплотную, буквенный код
     (DKK) — через узкую щель, иначе «DKK85» слипается. Пробелом её ставить
     нельзя, см. txSign. */
  if (sign.length > 1) {
    var gap = document.createElement('i');
    gap.className = 'gsep';
    sum.appendChild(gap);
  }

  var val = document.createElement('span');
  val.innerHTML = txAmountHtml(it.amount);
  sum.appendChild(val);

  row.appendChild(name);
  row.appendChild(sum);
  return row;
}

/* Пока ждём — говорим, чего ждём. Молчаливое «Загружаю…» на сороковой секунде
   неотличимо от зависания, а причина ожидания у нас известна и не страшная. */
function loadingText() {
  return txSlow
    ? 'Загружаю… Apps Script просыпается: после обновления первый ответ идёт до минуты.'
    : 'Загружаю…';
}

/* Защита от собственного шторма (BUG-030).

   02.09.2026 приложение довело себя до отказа: запрос не дошёл → человек жмёт
   «Повторить» → ещё запрос → раздача Apps Script начинает отбивать частые GET
   страницей 404 → отказов больше → жмут чаще. Проверено снаружи: восемь проб
   подряд без пауз дали сплошные 404 с задержкой до 37 с, а одна проба после
   паузы — честные 200 за 5 с. Бэкенд при этом был здоров, бот отвечал.

   Поэтому два ограничителя: запрос не стартует, пока предыдущий в полёте
   (loadTx/load), и после отказа повтор доступен не сразу. Пауза короткая —
   она гасит серию нажатий, а не наказывает за одно. */
var RETRY_COOLDOWN_MS = 5000;
var retryAt = 0;                    /* до этого момента повтор заблокирован */

/* Отсчёт живёт на самой кнопке, а не в перерисовке блока: так он не тянет
   за собой renderTx/renderCats каждую секунду и не спорит с их состоянием. */
function armRetry(btn, onClick) {
  function paint() {
    var left = Math.ceil((retryAt - Date.now()) / 1000);
    if (left > 0) {
      btn.disabled = true;
      btn.textContent = '↻ Повторить через ' + left + ' с';
      return true;
    }
    btn.disabled = false;
    btn.textContent = '↻ Повторить';
    return false;
  }

  if (paint()) {
    var t = setInterval(function () {
      if (!paint() || btn.isConnected === false) clearInterval(t);
    }, 500);
  }

  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    onClick();
  });
}

function txStateNode(text, withRetry) {
  var box = document.createElement('div');
  box.className = 'tx-state';

  var msg = document.createElement('div');
  msg.textContent = text;
  box.appendChild(msg);

  if (withRetry) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    armRetry(btn, loadTx);
    box.appendChild(btn);
  }
  return box;
}

/* Сумма для чипа.

   Категория — из той же разбивки, что нарисована выше: своим сложением строк
   списка мы получили бы другое число (там валюта операции, здесь доллары) и
   спорили бы сами с собой.

   Фонд (BUG-031) — сумма отфильтрованных строк в долларах: ровно то число,
   которое стоит итогом в разбивке фонда над списком, оба считаются из одного
   множества. Пока бэкенд не кладёт usd в строки — суммы нет, чип молчит:
   ноль на месте неизвестного числа — то же враньё с уверенным лицом. */
function txFilterUsd(filter, list) {
  if (!filter) return null;

  if (filter.kind === 'fund') {
    if (!list || !list.length) return null;
    var sum = 0, seen = false;
    for (var k = 0; k < list.length; k++) {
      if (typeof list[k].usd !== 'number') continue;
      seen = true;
      if (list[k].usd > 0) sum += list[k].usd;
    }
    return seen ? sum : null;
  }

  if (!catData) return null;
  if (filter.value === CAT_UNKNOWN) return Number(catData.unknownUsd) || 0;

  var items = catData.items || [];
  for (var i = 0; i < items.length; i++) {
    if (items[i].name === filter.value) return Number(items[i].usd) || 0;
  }
  return null;
}

function txChipNode(list, covers) {
  var chip = document.createElement('div');
  chip.className = 'tx-chip';

  var text = document.createElement('span');
  text.className = 'tx-chip-text';
  text.textContent = txChipText(txFilter, list.length, covers);
  chip.appendChild(text);

  /* Сумма отдельным узлом — она подчиняется общей маске (FEAT-034). Иначе чип
     вернул бы открытым текстом ровно то число, которое человек только что
     спрятал тапом по соседней строке. */
  var usd = txFilterUsd(txFilter, list);
  if (usd !== null) {
    var sum = document.createElement('span');
    sum.className = 'tx-chip-sum' + (amountsMasked ? ' masked' : '');
    if (amountsMasked) sum.textContent = '••••';
    else               sum.innerHTML = moneyHtml(usd);
    sum.addEventListener('click', toggleAmountsMask);
    chip.appendChild(sum);
  }

  var clear = document.createElement('button');
  clear.type = 'button';
  clear.className = 'tx-chip-clear';
  clear.setAttribute('aria-label', 'Снять фильтр');
  clear.textContent = '✕';
  clear.addEventListener('click', clearTxFilter);
  chip.appendChild(clear);

  return chip;
}

function renderTx() {
  var toggle = document.getElementById('txToggle');
  var title  = document.getElementById('txTitle');
  var box    = document.getElementById('txBody');

  /* Подпись справа — единственное место, где отказ загрузки виден, пока блок
     свёрнут. Молчать нельзя: фоновая загрузка, которая тихо не сработала,
     выглядит как «трат просто нет». */
  toggle.textContent = txExpanded ? 'скрыть'
                     : (txState === 'error' ? 'не загрузились' : 'показать');
  toggle.setAttribute('aria-expanded', txExpanded ? 'true' : 'false');

  /* Заголовок — единственный след фильтра, когда блок свёрнут. */
  title.textContent = txFilter
    ? 'Траты · ' + txFilter.value + (txFilter.cat ? ' · ' + txFilter.cat : '')
    : 'Последние траты';

  box.className = txExpanded ? '' : 'hidden';
  box.textContent = '';
  if (!txExpanded) return;

  if (txState === 'loading' || txState === 'idle') {
    box.appendChild(txStateNode(loadingText(), false));
    return;
  }
  if (txState === 'error') {
    box.appendChild(txStateNode(txErrorText || 'Траты не загрузились.', true));
    return;
  }

  var list   = txFilterItems(txItems, txFilter, txCycleStart);
  var covers = txWindowCoversCycle(txItems, txCycleStart);

  /* Чип рисуем и при пустом результате: он объясняет, чем отфильтровано, и
     держит выход. Убрать его вместе со строками значило бы запереть человека
     в отфильтрованном блоке без единой кнопки назад. */
  if (txFilter) box.appendChild(txChipNode(list, covers));

  if (!list.length) {
    box.appendChild(txStateNode(txEmptyText(txFilter, covers), false));
    box.appendChild(txNoteNode());
    return;
  }

  var visible = list.slice(0, txShown);
  var splitAt = txCycleSplit(visible, txCycleStart);
  var now     = Date.now();
  var lastDay = null;

  for (var i = 0; i < visible.length; i++) {
    /* Граница цикла крупнее границы дня, поэтому идёт перед заголовком дня. */
    if (i === splitAt) {
      var sep = document.createElement('div');
      sep.className = 'tx-cycle';
      var when = document.createElement('span');
      when.textContent = txShortDate(txCycleStart) + ' · начало цикла';
      sep.appendChild(when);
      box.appendChild(sep);
      lastDay = null;
    }

    var label = txDayLabel(visible[i].ts, now);
    if (label !== lastDay) {
      var head = document.createElement('div');
      head.className = 'tx-day';
      head.textContent = label;
      box.appendChild(head);
      lastDay = label;
    }

    box.appendChild(txRowNode(visible[i]));
  }

  if (list.length > txShown) {
    var left = list.length - txShown;
    var step = Math.min(TX_STEP, left);

    var lbl = document.createElement('span');
    lbl.textContent = 'Ещё ' + step;

    var caret = document.createElement('span');
    caret.className = 'fund-caret';
    caret.textContent = '▾';

    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'fund-more';
    more.appendChild(lbl);
    more.appendChild(caret);
    more.addEventListener('click', function () {
      txShown += TX_STEP;
      txRefocus = true;          /* список дорисовывается — кнопка уезжает вниз */
      renderTx();
    });
    box.appendChild(more);

    if (txRefocus) { txRefocus = false; try { more.focus(); } catch (e) {} }
  } else {
    txRefocus = false;
  }

  box.appendChild(txNoteNode());
}

/* Сноска о неполноте журнала. Живёт под списком, а не над ним: это оговорка,
   а не предупреждение, и открывают блок ради строк, а не ради неё. */
function txNoteNode() {
  var note = document.createElement('div');
  note.className = 'tx-note';
  note.textContent = 'Только траты, записанные автоматически или вручную ' +
                     'через бота. Наличные мимо бота и медицина через страховую сюда не попадают.';
  return note;
}

function haptic() {
  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
  }
}

function toggleTxSection() {
  txExpanded = !txExpanded;
  renderTx();
  haptic();
}

/* Сколько списка обязано приехать на экран вместе с фильтром: чип, заголовок
   дня и пара строк. Меньше — и видно, что «что-то появилось», но не видно что. */
var TX_REVEAL = 160;

/* Строка, по которой тапнули, — до и после перерисовки это РАЗНЫЕ узлы
   (repaintFilter перестраивает оба блока), поэтому ищем её по ключу, а не
   держим ссылку. */
function filterAnchorEl_(kind, value) {
  var list = document.querySelectorAll(
    kind === 'fund' ? '#funds .fund' : '#catBody .cat, #catBody .cat-aside');
  for (var i = 0; i < list.length; i++) {
    if (list[i].getAttribute('data-key') === value) return list[i];
  }
  return null;
}

/* Доводка экрана после тапа (BUG-028).

   Первая версия просто прыгала к заголовку блока трат — и на телефоне это
   читалось как сбой: строка, по которой человек тапнул, уезжала за верхнюю
   кромку вместе со всем блоком категорий. Точка отсчёта пропадала, а новая
   (заголовок и чип) появлялась мгновенно, без перехода, — тап выглядел как
   «экран куда-то выбросило».

   Теперь ЯКОРЬ — сама тапнутая строка: она встаёт под верхнюю кромку и
   остаётся видимой, список раскрывается прямо под ней. Целимся в пересечение
   двух условий: строка не выше кромки (hi) и результат не ниже нижнего края
   (lo). Обычно интервал непустой, и мы берём hi — контекст сохранён целиком.
   Если блок категорий длинный и оба условия разом не выполняются, приоритет
   у результата (lo): показать то, ради чего тапали, важнее.

   Уже на месте — не двигаемся вовсе: скролл, который «доводит» на пять
   пикселей, ощущается как дрожь.

   Ищем якорь ЗАНОВО через `.picked`, а не держим ссылку на узел: repaintFilter
   перерисовывает оба блока, и старый узел к этому моменту уже выброшен. */
/* Свёртка остальных категорий убирает из потока всё, что стояло НАД тапнутой
   строкой, — без компенсации страница уехала бы вверх и строка ушла бы
   из-под пальца. Двигаем скролл ровно на столько, на сколько уехала строка:
   она остаётся на месте экрана, а вокруг неё блок складывается. Мгновенно,
   не плавно: это не перемещение взгляда, а отмена паразитного сдвига —
   анимировать её значило бы показать движение, которого нет. */
function holdAnchor(kind, value, wasTop) {
  if (wasTop === null) return;
  var el = filterAnchorEl_(kind, value);
  if (!el) return;
  var d = el.getBoundingClientRect().top - wasTop;
  if (Math.abs(d) > 1) window.scrollBy(0, d);
}

/* Якорь — та строка, по которой тапнули, а не «любая с засечкой»: при
   фонде с уточнением категорией (BUG-031) засечек две, и первая в документе —
   строка фонда наверху, тогда как палец лежал на строке категории. */
function scrollToFilter(kind, value) {
  var anchor = filterAnchorEl_(kind, value);
  var chip   = document.querySelector('#txBody .tx-chip');
  if (!anchor || !chip) return;

  var y  = window.pageYOffset || document.documentElement.scrollTop || 0;
  var vh = window.innerHeight || document.documentElement.clientHeight || 0;
  if (!vh) return;

  var anchorTop = anchor.getBoundingClientRect().top + y;
  var chipTop   = chip.getBoundingClientRect().top + y;

  var lo = chipTop + TX_REVEAL - vh;   /* ниже — результат не поместится */
  var hi = anchorTop - 12;             /* выше — уедет тапнутая строка */

  var target = (lo > hi) ? lo : hi;
  if (target < 0) target = 0;
  if (Math.abs(target - y) < 8) return;

  /* Плавно: глаз должен проследить путь, иначе смена кадра снова читается
     как выброс. Движение короткое — якорь рядом, а не через пол-страницы. */
  try { window.scrollTo({ top: target, behavior: 'smooth' }); }
  catch (e) { window.scrollTo(0, target); }
}

/* Перерисовать всё, что показывает активный фильтр: засечка в фондах,
   засечка в категориях, сам список. Одна точка — иначе состояния разойдутся,
   как уже расходились у маски сумм. */
function repaintFilter() {
  renderFunds(lastData && lastData.funds ? lastData.funds : []);
  renderCats();
  renderTx();
}

/* Тап по фонду или по категории: ставит фильтр и разворачивает блок трат.
   Повторный тап по той же строке снимает фильтр, но блок оставляет открытым —
   свернуть его обратно значило бы наказать за любопытство.

   Фильтр один: выбор категории молча снимает фонд и наоборот. Отдельного
   уведомления об этом нет намеренно — заголовок и чип меняются в тот же кадр,
   плюс haptic, а всплывашка ради обратимого тапа была бы шумом.

   Исключение (BUG-031): пока выбран фонд, блок категорий показывает разбивку
   этого фонда, и тап по её строке НЕ меняет фонд на категорию, а уточняет
   фильтр фонда категорией. Повторный тап по той же категории снимает только
   уточнение, фонд остаётся. Тап по самому фонду снимает всё. */
function pickTxFilter(kind, value) {
  var inFund = !!(txFilter && txFilter.kind === 'fund');
  var next;

  if (kind === 'cat' && inFund) {
    next = { kind: 'fund', value: txFilter.value };
    if (txFilter.cat !== value) next.cat = value;
  } else {
    var same = txFilter && txFilter.kind === kind && txFilter.value === value;
    next = same ? null : { kind: kind, value: value };
  }

  /* Положение строки на экране ДО перестройки — к нему и вернём (holdAnchor). */
  var before = filterAnchorEl_(kind, value);
  var wasTop = before ? before.getBoundingClientRect().top : null;

  txFilter   = next;
  txShown    = TX_FIRST;   /* иначе новый фильтр открылся бы сразу на 40 строк */
  txRefocus  = false;
  txExpanded = true;
  catAll     = false;      /* новый выбор всегда складывает разбивку до одной строки */

  repaintFilter();

  /* Через кадр: блок трат только что развернулся, а блок категорий сложился —
     до пересчёта раскладки координаты и чипа, и строки ещё не существуют. */
  function settle() {
    holdAnchor(kind, value, wasTop);
    scrollToFilter(kind, value);
  }
  if (window.requestAnimationFrame) window.requestAnimationFrame(settle);
  else settle();

  haptic();
}

/* Крестик в чипе. Скролла здесь нет: человек уже стоит в блоке трат, и
   доводка экрана дёрнула бы страницу без нужды. */
function clearTxFilter(ev) {
  if (ev) ev.stopPropagation();
  txFilter  = null;
  txShown   = TX_FIRST;
  txRefocus = false;
  repaintFilter();
  haptic();
}

/* ===========================================================================
   FEAT-036 — КАТЕГОРИИ ЗА ЦИКЛ

   Данные приезжают тем же ответом part=tx, что и список трат, поэтому
   состояние загрузки у блоков ОБЩЕЕ (txState): одна загрузка, один отказ,
   одна кнопка «Повторить». Второй эндпоинт дал бы второй загрузчик и второе
   место, где что-то может тихо не приехать.

   Суммы здесь — в валюте экрана и подчиняются тапу по валюте (FEAT-031),
   в отличие от списка трат ниже, где стоит валюта операции. Разница
   намеренная и названа словами в сноске блока: сложить лари с рублями
   в один столбик нельзя, а сумма отдельной операции — факт, а не оценка.
   =========================================================================== */

var CAT_FIRST = 6;           /* сколько строк видно сразу */

/* Имя строки «без категории». Зеркало ANALYTICS_UNKNOWN_CATEGORY из
   phase4_analytics.js: бэкенд нормализует к нему и разбивку, и категорию
   каждой траты, поэтому фильтр по нему — обычное равенство строк, без
   отдельной ветки. Продублировано осознанно, как TX_NEVER_SPENT: это текст
   экрана. Разойдётся — фильтр «Без категории» отдаст пустоту, и тест
   сверки в test_miniapp_cats.js это поймает. */
var CAT_UNKNOWN = 'Не определено';

var catData     = null;      /* объект cats из ответа part=tx */
var catExpanded = false;     /* разворот блока — как у фондов, между запусками не помним */
var catAll      = false;     /* показаны все категории или первые CAT_FIRST */

/* --- Чистые помощники (покрыты test_miniapp_cats.js) --- */

/* Доля категории в тратах периода. Округляем до целого: десятые доли
   процента на волосяной полосе всё равно неразличимы. */
function catShare(usd, total) {
  if (!total) return 0;
  return Math.round((Number(usd) || 0) / total * 100);
}

/* Дельта к тому же отрезку прошлого цикла, в процентах.
   Прошлого нет (новая категория) → null: «+100%» от нуля — не рост,
   а деление на ноль с уверенным лицом. */
function catDelta(usd, prevUsd) {
  var prev = Number(prevUsd) || 0;
  if (prev <= 0) return null;
  return Math.round(((Number(usd) || 0) - prev) / prev * 100);
}

/* Порог, ниже которого дельту считаем шумом: округление сумм в долларах
   само по себе даёт единицы процентов. */
function catDeltaClass(pct) {
  if (pct === null) return 'flat';
  if (pct >= 3)  return 'up';     /* тратим больше — красные чернила */
  if (pct <= -3) return 'down';   /* тратим меньше — зелёная линовка */
  return 'flat';
}

function catDeltaText(pct) {
  if (pct === null) return '';
  if (pct > 0)  return '+' + pct + '%';
  if (pct < 0)  return MINUS + Math.abs(pct) + '%';
  return '0%';
}

function catDayText(dayIndex, dayTotal) {
  return 'день ' + dayIndex + ' из ' + dayTotal;
}

/* Строка сравнения под итогом. Пишем словами, а не одним числом со стрелкой:
   «+8%» без указания, к чему, читается как «за день» или «к плану». */
function catVsText(pct, dayIndex) {
  if (pct === null) return 'Не с чем сравнить: за тот же отрезок прошлого цикла трат нет.';
  var dayPart = 'к ' + dayIndex + '-му дню прошлого цикла';
  if (pct === 0)  return 'Столько же, сколько ' + dayPart + '.';
  if (pct > 0)    return 'На ' + pct + '% больше, чем ' + dayPart + '.';
  return 'На ' + Math.abs(pct) + '% меньше, чем ' + dayPart + '.';
}

/* Разбивка ФОНДА по категориям (BUG-031) — на клиенте, из строк списка.
   Окно то же, что у фильтра по фонду: весь загруженный хвост, цикл не важен,
   поэтому итог здесь и сумма в чипе под списком — одно число из одного
   множества. Суммы — из usd (колонка H), как у разбивки цикла: валюту
   операции складывать нельзя. Возвраты и нули не траты — пропускаем, как
   miniAppAggregateCats_ на бэкенде.

   Без usd в строках (бэкенд старее страницы) — hasUsd = false, и блок
   говорит об этом словами, а не рисует нули с уверенным лицом. */
function catFundItems(items, fund) {
  var sums = {}, totalUsd = 0, unknownUsd = 0, count = 0, hasUsd = false;

  (items || []).forEach(function (it) {
    if (it.fund !== fund) return;
    count++;
    if (typeof it.usd !== 'number') return;
    hasUsd = true;
    if (!(it.usd > 0)) return;
    totalUsd += it.usd;
    var cat = it.cat || CAT_UNKNOWN;
    if (cat === CAT_UNKNOWN) { unknownUsd += it.usd; return; }
    sums[cat] = (sums[cat] || 0) + it.usd;
  });

  var list = [];
  for (var name in sums) list.push({ name: name, usd: sums[name] });
  list.sort(function (a, b) { return b.usd - a.usd; });

  return { count: count, hasUsd: hasUsd, totalUsd: totalUsd, unknownUsd: unknownUsd, items: list };
}

/* --- Отрисовка --- */

function catStateNode(text, withRetry) {
  var box = document.createElement('div');
  box.className = 'tx-state';        /* тот же служебный вид, что у списка трат */

  var msg = document.createElement('div');
  msg.textContent = text;
  box.appendChild(msg);

  if (withRetry) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    armRetry(btn, loadTx);
    box.appendChild(btn);
  }
  return box;
}

/* pick — имя фильтра, если строка тапабельная, иначе null. Две строки хвоста
   выглядят одинаково, а ведут себя по-разному, поэтому у тапабельной есть
   видимая засечка ›  — без неё пришлось бы объяснять словами, почему одна
   нажимается, а вторая нет. */
function catAsideNode(label, usd, first, pick) {
  var row = document.createElement('div');
  row.className = 'cat-aside' + (first ? ' first' : '') + (pick ? ' link' : '') +
    (pick && pickedCat(txFilter) === pick ? ' picked' : '');

  var name = document.createElement('span');
  name.textContent = label;

  if (pick) {
    row.setAttribute('data-key', pick);     /* якорь доводки, см. filterAnchorEl_ */

    var caret = document.createElement('span');
    caret.className = 'cat-aside-caret';
    caret.textContent = '›';
    name.appendChild(caret);

    row.setAttribute('role', 'button');
    row.tabIndex = 0;
    row.addEventListener('click', function () { pickTxFilter('cat', pick); });
    row.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pickTxFilter('cat', pick); }
    });
  }

  var sum = document.createElement('span');
  sum.className = 'cat-aside-sum';
  if (amountsMasked) sum.textContent = '••••';
  else               sum.textContent = money(usd);
  sum.addEventListener('click', toggleAmountsMask);

  row.appendChild(name);
  row.appendChild(sum);
  return row;
}

/* bare — строка разбивки фонда (BUG-031): без дельты к прошлому циклу.
   Фондовые траты редкие и крупные (билеты, техника), сравнение с прошлым
   отрезком дало бы случайные ±300%, а окно у фонда и не цикл вовсе. */
function catRow(item, total, bare) {
  var row = document.createElement('div');
  row.className = 'cat' + (pickedCat(txFilter) === item.name ? ' picked' : '');
  row.setAttribute('data-key', item.name);   /* якорь доводки, см. filterAnchorEl_ */

  /* FEAT-038: строка категории фильтрует список трат под блоком — тем же
     жестом, что и строка фонда. Верх экрана тап не трогает: perDay и шкала
     считаются по циклу целиком, «дневного лимита категории» не существует.
     При выбранном фонде тот же тап уточняет фильтр фонда (pickTxFilter). */
  row.setAttribute('role', 'button');
  row.tabIndex = 0;
  row.addEventListener('click', function () { pickTxFilter('cat', item.name); });
  row.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pickTxFilter('cat', item.name); }
  });

  var head = document.createElement('div');
  head.className = 'cat-head';

  var name = document.createElement('span');
  name.className = 'cat-name';
  name.textContent = item.name;      /* имя категории из таблицы — только textContent */

  /* Суммы категорий скрываются тем же общим флагом, что и суммы фондов
     (FEAT-034): иначе спрятал фонды, а рядом открытым текстом лежит, сколько
     ушло на продукты — маска перестаёт делать то, ради чего сделана.
     Тап по самой сумме переключает маску (BUG-027) — свой таргет внутри
     строки, всплытие гасит сам toggleAmountsMask, поэтому фильтр на строке
     (FEAT-038) с ним не спорит. */
  var sum = document.createElement('span');
  sum.className = 'cat-sum' + (amountsMasked ? ' masked' : '');
  if (amountsMasked) sum.textContent = '••••';
  else               sum.innerHTML = moneyHtml(item.usd);
  sum.addEventListener('click', toggleAmountsMask);

  head.appendChild(name);
  head.appendChild(sum);

  var line = document.createElement('div');
  line.className = 'cat-line';

  var share = catShare(item.usd, total);

  var bar = document.createElement('span');
  bar.className = 'cat-bar';
  var fill = document.createElement('i');
  fill.style.width = Math.max(share, 1) + '%';   /* 1% — чтобы линия не исчезала совсем */
  bar.appendChild(fill);

  var shareNode = document.createElement('span');
  shareNode.className = 'cat-share';
  shareNode.textContent = share + '%';

  line.appendChild(bar);
  line.appendChild(shareNode);

  if (!bare) {
    var pct = catDelta(item.usd, item.prevUsd);
    var delta = document.createElement('span');
    delta.className = 'cat-delta ' + catDeltaClass(pct);
    delta.textContent = catDeltaText(pct);
    line.appendChild(delta);
  }

  row.appendChild(head);
  row.appendChild(line);
  return row;
}

/* Шапка обеих разбивок: сколько ушло + подпись справа. */
function catLeadNode(total, rightText) {
  var lead = document.createElement('div');
  lead.className = 'cat-lead';

  var totalNode = document.createElement('span');
  totalNode.className = 'cat-total' + (amountsMasked ? ' masked' : '');
  if (amountsMasked) totalNode.textContent = '••••';
  else               totalNode.innerHTML = moneyHtml(total);
  totalNode.addEventListener('click', toggleAmountsMask);

  var dayNode = document.createElement('span');
  dayNode.className = 'cat-day';
  dayNode.textContent = rightText;

  lead.appendChild(totalNode);
  lead.appendChild(dayNode);
  return lead;
}

/* Остальные категории раскрываем РАЗОМ, а не ступенями: их всего десять
   (04_data_model §5), и вторая бесконечная кнопка «Ещё» на одном экране
   с такой же кнопкой под тратами читалась бы как одна и та же. */
function catMoreNode(left) {
  var more = document.createElement('button');
  more.type = 'button';
  more.className = 'fund-more';
  more.setAttribute('aria-expanded', catAll ? 'true' : 'false');

  var label = document.createElement('span');
  label.textContent = catAll ? 'Свернуть' : 'Ещё ' + left + ' ' +
    plural(left, 'категория', 'категории', 'категорий');

  var caret = document.createElement('span');
  caret.className = 'fund-caret';
  caret.textContent = '▾';

  more.appendChild(label);
  more.appendChild(caret);
  more.addEventListener('click', function () {
    catAll = !catAll;
    renderCats();
    haptic();
  });
  return more;
}

/* Строки разбивки. SOLO (BUG-028): пока по категории стоит засечка,
   разбивка складывается до ОДНОЙ строки — той, по которой тапнули. Так
   решается не симптом, а причина прыжка: между строкой и её составом больше
   не лежит полблока, доводить экран почти нечем.

   Складываем не в ничто, а в «Ещё N категорий»: иначе ломается сценарий
   «посмотрел продукты — теперь кафе». Кнопка разворачивает разбивку обратно,
   НЕ снимая фильтр — выбранная строка остаётся с засечкой среди прочих.

   Возвращает, сложилась ли разбивка (нужно хвосту под ней). */
function catRowsInto(box, items, total, bare) {
  var picked = pickedCat(txFilter);
  var solo   = !!picked && !catAll;

  var visible;
  if (solo)        visible = items.filter(function (it) { return it.name === picked; });
  else if (catAll) visible = items;
  else             visible = items.slice(0, CAT_FIRST);

  visible.forEach(function (it) { box.appendChild(catRow(it, total, bare)); });

  var hidden = items.length - visible.length;
  if (solo ? hidden > 0 : items.length > CAT_FIRST) {
    box.appendChild(catMoreNode(solo ? hidden : items.length - CAT_FIRST));
  }
  return solo;
}

function renderCats() {
