  var toggle = document.getElementById('catToggle');
  var title  = document.getElementById('catTitle');
  var box    = document.getElementById('catBody');
  if (!toggle || !box) return;

  /* Подпись справа — единственное место, где отказ виден, пока блок свёрнут.
     Ровно та же логика, что у списка трат: молчащий блок читается как
     «трат просто нет». */
  toggle.textContent = catExpanded ? 'скрыть'
                     : (txState === 'error' ? 'не загрузились' : 'показать');
  toggle.setAttribute('aria-expanded', catExpanded ? 'true' : 'false');

  /* BUG-031: при выбранном фонде блок показывает разбивку ЭТОГО фонда, и
     заголовок говорит об этом, пока блок свёрнут, — как у списка трат. */
  var fundMode = !!(txFilter && txFilter.kind === 'fund');
  if (title) title.textContent = fundMode ? 'Категории · ' + txFilter.value : 'Категории';

  box.className = catExpanded ? '' : 'hidden';
  box.textContent = '';
  if (!catExpanded) return;

  if (txState === 'loading' || txState === 'idle') {
    box.appendChild(catStateNode(loadingText(), false));
    return;
  }
  if (txState === 'error') {
    box.appendChild(catStateNode(txErrorText || 'Категории не загрузились.', true));
    return;
  }
  if (fundMode) {
    renderFundCats(box);
    return;
  }
  if (!catData) {
    box.appendChild(catStateNode('Разбивку посчитать не удалось.', true));
    return;
  }

  var total = Number(catData.totalUsd) || 0;

  /* Шапка: сколько потрачено и на каком дне цикла. */
  box.appendChild(catLeadNode(total, catDayText(catData.dayIndex, catData.dayTotal)));

  var vs = document.createElement('div');
  vs.className = 'cat-vs';
  vs.textContent = catVsText(catDelta(total, catData.prevTotalUsd), catData.dayIndex);
  box.appendChild(vs);

  var items = catData.items || [];

  if (!items.length) {
    box.appendChild(catStateNode(total ? 'Все траты цикла — из фондов.' : 'В этом цикле трат ещё нет.', false));
  }

  var solo = catRowsInto(box, items, total, false);

  /* Фондовые траты и «Не определено» — не категории, поэтому отдельными
     строками под разбивкой, а не в общем ряду.

     «Из фондов» НЕ тапается: то же множество уже достижимо тапом по фонду,
     но с другим окном (весь хвост против текущего цикла). Два разных ответа
     на один вопрос убивают доверие к экрану быстрее, чем отсутствие второго
     жеста. «Без категории» тапается — это единственный список, с которым
     человек что-то сделает: пойдёт в бота и проставит категории.

     В solo-режиме хвост складывается по тому же правилу, что и строки: на
     экране остаётся только активная строка. Оставить рядом два чужих
     ведра значило бы свернуть разбивку наполовину. */
  var soloUnknown = solo && pickedCat(txFilter) === CAT_UNKNOWN;

  var asideFirst = true;
  if (catData.fundUsd && !solo) {
    box.appendChild(catAsideNode('Из фондов', catData.fundUsd, asideFirst, null));
    asideFirst = false;
  }
  if (catData.unknownUsd && (!solo || soloUnknown)) {
    box.appendChild(catAsideNode('Без категории', catData.unknownUsd, asideFirst, CAT_UNKNOWN));
    asideFirst = false;
  }

  var note = document.createElement('div');
  note.className = 'tx-note';
  note.textContent = catData.truncated
    ? 'Период показан не целиком: в окно последних трат уместилась не вся история цикла. Суммы могут быть занижены.'
    : 'Фондовые траты в разбивку не входят — они не бьют по дневному бюджету. Суммы здесь в валюте экрана, в отличие от списка трат ниже.';
  box.appendChild(note);
}

/* Разбивка выбранного фонда (BUG-031). До этого при тапе по фонду список
   под блоком фильтровался, а сам блок продолжал показывать разбивку цикла —
   и читался как ответ на другой вопрос. Теперь блок и список считаются из
   одного множества строк (catFundItems ↔ txFilterItems): итог здесь равен
   сумме в чипе под списком.

   Дельты к прошлому циклу и «день N из M» здесь нет намеренно: окно фонда —
   не цикл, а фондовые траты редкие и крупные, сравнение дало бы случайные
   проценты. Тап по строке уточняет фильтр фонда категорией (pickTxFilter). */
function renderFundCats(box) {
  var fundName = txFilter.value;
  var agg = catFundItems(txItems, fundName);

  if (!agg.count) {
    box.appendChild(catStateNode(txEmptyText({ kind: 'fund', value: fundName }, false), false));
    return;
  }

  /* Тихий фолбэк — невидимый отказ: страница может оказаться новее бэкенда
     (зеркало и Apps Script деплоятся порознь). Нули на месте неизвестных
     сумм выглядели бы как «из фонда не тратили». */
  if (!agg.hasUsd) {
    box.appendChild(catStateNode(
      'Суммы в долларах не пришли — Apps Script старее страницы. Разбивка по фонду появится после его обновления.', false));
    return;
  }

  box.appendChild(catLeadNode(agg.totalUsd,
    'из фонда · ' + agg.count + ' ' + plural(agg.count, 'трата', 'траты', 'трат')));

  if (!agg.items.length && !agg.unknownUsd) {
    box.appendChild(catStateNode('У этих трат нет суммы в долларах — раскладывать нечего.', false));
    return;
  }

  var solo = catRowsInto(box, agg.items, agg.totalUsd, true);

  var soloUnknown = solo && pickedCat(txFilter) === CAT_UNKNOWN;
  if (agg.unknownUsd && (!solo || soloUnknown)) {
    box.appendChild(catAsideNode('Без категории', agg.unknownUsd, true, CAT_UNKNOWN));
  }

  var note = document.createElement('div');
  note.className = 'tx-note';
  note.textContent = 'Те же траты, что в списке ниже: последние загруженные из фонда, без границы цикла. Суммы в валюте экрана по курсу на день траты.';
  box.appendChild(note);
}

function toggleCatSection() {
  catExpanded = !catExpanded;
  renderCats();
  haptic();
}

/* Тексты отказа здесь НЕЙТРАЛЬНЫЕ («данные», не «список трат»): причина одна
   на оба блока, и в блоке категорий сообщение про список трат читалось бы как
   чужое, попавшее не в своё окно.

   Отдельный запрос, фоном, после того как экран уже нарисован. В localStorage
   НЕ кладём: кеш там держит числа для холодного старта, а список трат — вещь
   второстепенная, ради неё раздувать сохранённый payload незачем.

   Запасного пути нет намеренно. Не сработало — блок скажет об этом и даст
   «Повторить»; тихая догрузка по требованию замаскировала бы мёртвый
   prefetch, и мы бы о нём не узнали. */
function loadTx() {
  /* Повторный вход, пока запрос в полёте, не ускорит его ни на миллисекунду —
     только добавит ещё одно выполнение в очередь (BUG-030). */
  if (txState === 'loading') return;

  txState = 'loading';
  txSlow  = false;
  renderTx();
  renderCats();

  var initData = tg && tg.initData ? tg.initData : '';

  jsonp(API_URL, { initData: initData, part: 'tx' }, function (data) {
    if (data && data.error) {
      txState = 'error';
      txErrorText = reasonMessage(data.reason).title + '. Данные не загрузились.';
      renderTx();
      renderCats();
      return;
    }
    if (!data || !data.tx) {
      txState = 'error';
      txErrorText = 'Apps Script ответил, но данных не прислал.';
      renderTx();
      renderCats();
      return;
    }

    txItems      = data.tx;
    txCycleStart = Number(data.cycleStart) || 0;
    catData      = data.cats || null;    /* FEAT-036: разбивка тем же ответом */
    txState      = 'ready';
    renderTx();
    renderCats();

  }, function (kind) {
    txState = 'error';
    txErrorText = kind === 'timeout' ? 'Ответа не дождались.'
                                     : 'Данные не загрузились.';
    retryAt = Date.now() + RETRY_COOLDOWN_MS;
    renderTx();
    renderCats();

  }, function () {
    txSlow = true;      /* подпись в обоих блоках, загрузку не прерываем */
    renderTx();
    renderCats();
  });
}

/* BUG-026. Отказ ОСНОВНОГО запроса обязан гасить и блок трат: loadTx() зовётся
   только из ветки успеха, поэтому без этого txState оставался 'idle' — подпись
   блока говорила «показать», как при нормальных данных, а внутри бессрочно
   висело «Загружаю…» без кнопки повтора. Никто в этот момент ничего не грузил.
   Плашка ошибки сверху видна, так что отказ не был тихим, но блок сообщал
   о состоянии, которого нет, и не давал из него выхода. */
function txFailMain(text) {
  txState     = 'error';
  txErrorText = text;
  renderTx();
  renderCats();   /* блоки едут одним запросом — и гаснут вместе */
}

/* --- Сообщения ------------------------------------------------------------ */

/* Кнопка повтора живёт В САМОМ сообщении, а не только в подвале.
   Подвал лежит внутри #content, а он скрыт, пока данных не было ни разу —
   тогда текст «нажмите Обновить» указывал бы на кнопку, которой на экране
   нет. Тупик того же рода, что BUG-009 на дашборде. */
function showError(title, bodyHtml, alarm) {
  var box = document.getElementById('errorBlock');
  box.className = 'notice' + (alarm ? ' alarm' : '');
  box.innerHTML =
    '<div class="notice-title"></div>' +
    '<div class="notice-body"></div>' +
    '<div style="margin-top:14px"><button class="btn" id="retryBtn" type="button">↻ Повторить</button></div>';
  box.querySelector('.notice-title').textContent = title;
  box.querySelector('.notice-body').innerHTML = bodyHtml;
  armRetry(document.getElementById('retryBtn'), load);
}
function clearError() {
  var box = document.getElementById('errorBlock');
  box.className = 'hidden';
  box.textContent = '';
}

/* Форма ввода адреса. Отдельный блок — ошибки её не затирают (BUG-009). */
function showSetup(currentUrl) {
  var box = document.getElementById('setupBlock');
  box.className = 'notice';
  box.innerHTML =
    '<div class="notice-title">Адрес веб-приложения</div>' +
    '<div class="notice-body">Ссылка вида <code>…/exec</code> из Apps Script → Развернуть. ' +
    'Ключ <code>?key=</code> добавлять не нужно — мини-апп ходит по подписи Telegram.</div>' +
    '<input class="setup-input" id="apiInput" placeholder="https://script.google.com/macros/s/…/exec" ' +
    'autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div style="margin-top:12px"><button class="btn" id="apiSave" type="button">Сохранить</button></div>';

  var input = document.getElementById('apiInput');
  input.value = currentUrl || '';
  document.getElementById('apiSave').addEventListener('click', function () {
    var v = input.value.trim();
    if (!v) return;
    localStorage.setItem(LS_URL, v);
    API_URL = v;
    box.className = 'hidden';
    box.textContent = '';
    load();
  });
}

/* --- Транспорт ------------------------------------------------------------ */

var jsonpSeq = 0;

/* Потолок ожидания (BUG-029). Был 15 с — и это оказалось меньше, чем честная
   работа бэкенда. Замеры по журналу выполнений 02.09.2026: обычный `part=tx`
   идёт 2–3 с, но на холодном контейнере или непересчитанном листе — 9,7 / 12,6 /
   17,0 с, а первое выполнение после публикации новой версии (компиляция ~500 КБ
   кода) — 45,7 с. Все они завершались УСПЕШНО: страница отваливалась от рабочего
   ответа и показывала «не загрузились» там, где надо было просто подождать.

   Повтор вместо ожидания рассматривался и отклонён: брошенное выполнение на
   стороне Apps Script всё равно доработает до конца, и повтор просто запустит
   второе такое же — двойной расход квоты ради того, что и так приедет.

   45 с закрывает и холодный старт, и худший замер с запасом. Настоящий обрыв
   связи столько не ждут — его ловит script.onerror, он срабатывает сразу. */
var JSONP_TIMEOUT_MS = 45000;

/* Когда сказать вслух, что это надолго. 9 с — выше обычных 2–3 с, поэтому на
   штатной загрузке подпись не мелькает, но заметно раньше потолка: молчащий
   «Загружаю…» на сороковой секунде читается как зависание. */
var JSONP_SLOW_MS = 9000;

function jsonp(url, params, onDone, onFail, onSlow) {
  var name = 'miniappCb' + (++jsonpSeq) + '_' + Date.now();
  var script = document.createElement('script');
  var timer, slowTimer;

  function cleanup() {
    clearTimeout(timer);
    clearTimeout(slowTimer);
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[name] = function (data) { cleanup(); onDone(data); };

  timer = setTimeout(function () { cleanup(); onFail('timeout'); }, JSONP_TIMEOUT_MS);
  if (onSlow) slowTimer = setTimeout(onSlow, JSONP_SLOW_MS);
  script.onerror = function () { cleanup(); onFail('network'); };

  var qs = ['action=miniapp', 'callback=' + name];
  for (var k in params) qs.push(k + '=' + encodeURIComponent(params[k]));
  script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + qs.join('&');
  document.body.appendChild(script);
}

/* --- Загрузка ------------------------------------------------------------- */

function reasonMessage(reason) {
  if (reason === 'owner_not_set') {
    return {
      title: 'Остался один шаг',
      body: 'Подпись Telegram сошлась, но владелец мини-аппа ещё не назначен. ' +
            'Откройте редактор Apps Script и запустите функцию ' +
            '<code>approveLastMiniAppUser</code> — она возьмёт ваш id из этого входа.' +
            '<p>После этого вернитесь сюда и нажмите «Повторить».</p>',
      alarm: false
    };
  }
  if (reason === 'foreign_user') {
    return { title: 'Доступ закрыт',
             body: 'Этот аккаунт Telegram не назначен владельцем.', alarm: true };
  }
  if (reason === 'expired') {
    return { title: 'Подпись устарела',
             body: 'Закройте мини-апп и откройте заново — Telegram выдаст свежую подпись.',
             alarm: false };
  }
  if (reason === 'no_token') {
    return { title: 'Бот не настроен',
             body: 'В Script Properties нет <code>BOT_TOKEN</code>.', alarm: true };
  }
  if (reason === 'malformed' || reason === 'no_user') {
    return {
      title: 'Нет подписи Telegram',
      body: 'Страница открыта не из Telegram — тогда подписи взяться неоткуда. ' +
            'Откройте мини-апп через бота.',
      alarm: false
    };
  }
  return { title: 'Доступ закрыт',
           body: 'Причина: <code>' + (reason || 'неизвестна') + '</code>', alarm: true };
}

function readCache() {
  try { return JSON.parse(localStorage.getItem(LS_CACHE) || 'null'); }
  catch (e) { return null; }
}

var mainBusy = false;   /* основной запрос в полёте (BUG-030) */

function load() {
  /* Кнопка «Обновить» блокируется ниже, но точек входа больше: плашка отказа,
     старт и повтор из блоков. Флаг закрывает их все разом. */
  if (mainBusy) return;
  mainBusy = true;

  var btn = document.getElementById('refresh');
  btn.disabled = true;

  var initData = tg && tg.initData ? tg.initData : '';

  jsonp(API_URL, { initData: initData }, function (data) {
    btn.disabled = false;
    mainBusy = false;

    if (data && data.error) {
      retryAt = Date.now() + RETRY_COOLDOWN_MS;
      var m = reasonMessage(data.reason);
      showError(m.title, m.body, m.alarm);
      var cached = readCache();
      if (cached) render(cached, true);
      txFailMain(m.title + '. Данные не загрузились.');
      return;
    }
    if (!data || typeof data.perDay === 'undefined') {
      showError('Пустой ответ', 'Apps Script ответил, но данных не прислал.', true);
      txFailMain('Apps Script ответил, но данных не прислал.');
      return;
    }

    clearError();
    localStorage.setItem(LS_CACHE, JSON.stringify(data));
    render(data, false);
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    }

    /* FEAT-033: список трат догружаем фоном, уже показав дневной бюджет.
       Отдельным запросом — чтение хвоста !Транзакции тяжелее четырёх getRange
       главного листа и не должно задерживать герой. */
    loadTx();

  }, function (kind) {
    btn.disabled = false;
    mainBusy = false;
    retryAt = Date.now() + RETRY_COOLDOWN_MS;

    var cached = readCache();
    showError(
      kind === 'timeout' ? 'Долго не отвечает' : 'Не удалось соединиться',
      'Apps Script не ответил.' + (cached ? ' Ниже — последние сохранённые числа.' : '') +
      '<p>Проверьте связь и попробуйте ещё раз.</p>',
      false
    );
    if (cached) render(cached, true);
    txFailMain(kind === 'timeout' ? 'Ответа не дождались.'
                                  : 'Данные не загрузились.');

  }, function () {
    /* Основной запрос затянулся. Плашку не показываем — это не отказ, а
       ожидание; говорим тихо, в подвале, где и так живёт отметка времени. */
    var stamp = document.getElementById('stamp');
    if (stamp) stamp.textContent = 'Apps Script просыпается…';
  });
}

/* --- Старт ---------------------------------------------------------------- */

(function init() {
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.onEvent('themeChanged', applyTheme); } catch (e) {}
  }
  applyTheme();

  document.getElementById('refresh').addEventListener('click', load);

  /* Две точки входа в переключение валюты, обе — «по самой валюте»:
     крупный знак у героя и подпись «в чём» над колонкой фондов. */
  document.getElementById('perDay').addEventListener('click', cycleCurrency);
  document.getElementById('curNote').addEventListener('click', cycleCurrency);

  document.getElementById('txToggle').addEventListener('click', toggleTxSection);
  document.getElementById('catToggle').addEventListener('click', toggleCatSection);

  var saved = localStorage.getItem(LS_URL);
  if (saved) API_URL = saved;

  /* Показываем сохранённые числа СРАЗУ: вебвью открывается «холодным»,
     и пустой экран на секунду хуже, чем слегка приглушённые прошлые данные. */
  var cached = readCache();
  if (cached) render(cached, true);

  if (!API_URL || API_URL === API_URL_PLACEHOLDER) {
    showSetup('');
    return;
  }
  load();
})();
</script>
</body>
