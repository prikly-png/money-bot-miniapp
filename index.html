<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===========================================================================
   MONEY BOT — TELEGRAM MINI APP (FEAT-010, v1)

   МИР. Это не финтех-приложение, а личный леджер поверх Google-таблицы,
   которую владелец собрал сам. Отсюда бумага, чернила и линовка вместо
   карточек с тенями. Фонды здесь — не счета, а разметка поверх счетов
   (конверты), поэтому у них нет коробок: только линованные строки, как
   в бухгалтерской книге.

   ГЛУБИНА. Одна стратегия — волосяные линии, ни одной тени. Это бумага.
   Заодно снимает вечную проблему теней в тёмной теме.

   ТЕМА. Telegram решает, светло или темно; свои значения бумаги и чернил
   мы держим сами и подкрашиваем ПОД СЕБЯ хром телеграма (setBackgroundColor),
   а не наоборот. Иначе тёплая бумага утонула бы в нейтральном сером.
   =========================================================================== */

:root {
  /* Бумага и чернила — светлая тема */
  --paper:        #F4F1EA;   /* небелёная бухгалтерская бумага */
  --paper-sunk:   #EBE7DE;   /* углубление: то, что «вдавлено» в лист */
  --rule:         rgba(43, 41, 37, 0.10);   /* линовка */
  --rule-strong:  rgba(43, 41, 37, 0.18);   /* разделитель разделов */

  --ink:          #23211D;   /* основные чернила */
  --ink-soft:     rgba(35, 33, 29, 0.62);   /* подписи */
  --ink-faint:    rgba(35, 33, 29, 0.40);   /* метаданные */
  --ink-ghost:    rgba(35, 33, 29, 0.22);   /* шкала, засечки */

  --ledger:       #6E8A69;   /* зелёная линовка ledger-paper — «в норме» */
  --brick:        #A6503C;   /* красные чернила — минус, отставание */

  /* Шкала: 4px */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;

  --r-sm: 6px;  --r-md: 10px;

  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  /* Цифры — моноширинные намеренно: в бухгалтерии колонка чисел всегда
     моноширинная (лента арифмометра, графа леджера). Тёплая бумага вокруг
     не даёт этому читаться как терминал. */
  --font-num:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Roboto Mono", monospace;
}

:root.dark {
  --paper:        #1B1A18;
  --paper-sunk:   #211F1C;
  --rule:         rgba(238, 232, 220, 0.10);
  --rule-strong:  rgba(238, 232, 220, 0.16);

  --ink:          #EDE8DE;
  --ink-soft:     rgba(237, 232, 222, 0.60);
  --ink-faint:    rgba(237, 232, 222, 0.38);
  --ink-ghost:    rgba(237, 232, 222, 0.20);

  --ledger:       #8FAA89;   /* в тёмной десатурируем и осветляем */
  --brick:        #C2705A;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-wrap: pretty;
  /* Телеграм открывает вебвью поверх чата — резких скачков цвета быть не должно */
  transition: background-color 200ms cubic-bezier(0.23, 1, 0.32, 1);
}

body {
  padding:
    var(--s5)
    var(--s5)
    calc(var(--s8) + env(safe-area-inset-bottom, 0px));
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
}

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Разделитель разрядов. В моноширинном шрифте ЛЮБОЙ пробельный символ
   занимает полную ширину знака, и «$24 000» зияет дырой. Поэтому разделитель
   рисуем сами — пустой inline-block заданной ширины, независимо от шрифта. */
.gsep { display: inline-block; width: 0.3em; }

/* --- Шапка --------------------------------------------------------------- */

.head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
  margin-bottom: var(--s8);
}
.head-title {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.head-cycle { font-size: 11px; color: var(--ink-faint); }

/* --- Герой: сколько сегодня можно ---------------------------------------
   Один фокус на экран. Побеждает размером, весом и воздухом вокруг.
   Под ним — СОБСТВЕННАЯ АРИФМЕТИКА числа. В этом продукте дневной лимит
   не настройка, а следствие: Остаток ÷ дни до ЗП. Показать деление —
   значит объяснить, почему завтра число другое.
   ---------------------------------------------------------------------- */

.hero { margin-bottom: var(--s8); }

.hero-value {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 52px;
  font-weight: 600;
  letter-spacing: -0.035em;   /* оптический размер: крупное сжимаем */
  line-height: 1;
  display: block;
  /* Тап по числу переключает валюту показа. Отдельной кнопки нет намеренно:
     самая крупная валюта на экране — здесь, по ней и жмут. */
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 120ms ease;
}
.hero-value:active { opacity: 0.5; }
.hero-label {
  margin-top: var(--s3);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-soft);
}
.hero-math {
  margin-top: var(--s1);
  font-size: 12px;
  color: var(--ink-faint);
}

/* --- Шкала отклонения от плана -------------------------------------------
   НЕ прогресс-бар: залитого трека нет, «съеденной доли» нет. План — это
   ноль на оси, факт — засечка слева (жмёмся) или справа (идём с запасом).
   Так вопрос «отстаю или нет» читается без чтения чисел.
   ------------------------------------------------------------------------ */

.gauge { margin-top: var(--s6); }

.gauge-track {
  position: relative;
  height: 22px;
}
.gauge-line {
  position: absolute;
  top: 11px;
  left: 0; right: 0;
  height: 1px;
  background: var(--rule);
}
.gauge-zero {                 /* засечка плана */
  position: absolute;
  top: 3px;
  left: 50%;
  width: 1px;
  height: 17px;
  background: var(--ink-ghost);
  transform: translateX(-0.5px);
}
.gauge-mark {                 /* факт */
  position: absolute;
  top: 5px;
  width: 3px;
  height: 13px;
  border-radius: 1.5px;
  background: var(--ledger);
  transform: translateX(-1.5px);
  transition: left 320ms cubic-bezier(0.23, 1, 0.32, 1);
}
.gauge-mark.behind { background: var(--brick); }

/* Подписи стоят НАД и ПОД своими засечками, а не по краям строки:
   «план» по центру над своим тиком, отклонение — под маркером факта.
   Разные строки => пересечься не могут, и каждая подпись указывает на своё. */
.gauge-top, .gauge-bottom {
  position: relative;
  height: 15px;
  font-size: 11px;
  color: var(--ink-faint);
}
.gauge-plan, .gauge-delta {
  position: absolute;
  white-space: nowrap;
  transform: translateX(-50%);
  transition: left 320ms cubic-bezier(0.23, 1, 0.32, 1);
}
.gauge-plan { left: 50%; }
.gauge-delta { font-weight: 500; }
.gauge-delta.ahead  { color: var(--ledger); }
.gauge-delta.behind { color: var(--brick); }

/* --- Фонды: линованные строки, не карточки -------------------------------
   Порядок — ручной, по вниманию (см. FUND_PRIMARY в скрипте), а не по
   убыванию суммы: это его собственная раскладка по приоритетам,
   сортировать по числу = стереть смысл.

   Часть фондов уходит под разворот. Резервы (Депозит, Подушка) и «Мои»
   не решают вопрос «сколько сегодня можно» — на первом экране они только
   разбавляют четыре строки, ради которых экран открывают.
   ------------------------------------------------------------------------ */

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding-bottom: var(--s2);
  border-bottom: 1px solid var(--rule-strong);
  margin-bottom: var(--s1);
}
.section-title {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
/* Подпись «в чём» — она же переключатель валюты. Пунктир снизу: в мире бумаги
   так помечают сноску, к которой можно обратиться, и это не спорит с линовкой.

   Цель тапа расширена псевдоэлементом, а не паддингом: паддинг сбил бы
   выравнивание по базовой линии с заголовком «ФОНДЫ» в этой же флекс-строке. */
.section-note {
  position: relative;
  appearance: none;
  border: none;
  background: transparent;
  padding: 0 0 1px;
  font-family: inherit;
  font-size: 11px;
  color: var(--ink-faint);
  border-bottom: 1px dashed var(--ink-ghost);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color 120ms ease;
}
.section-note::after {
  content: '';
  position: absolute;
  inset: -14px -10px;         /* ≥44px по вертикали, layout не двигает */
}
.section-note:active { color: var(--ink-soft); }
.section-note:disabled {
  border-bottom-color: transparent;
  cursor: default;
}

.fund {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s4);
  min-height: 44px;
  padding: var(--s3) 0;
  border-bottom: 1px solid var(--rule);
}
.fund:last-child { border-bottom: none; }
.fund-name { font-size: 15px; font-weight: 400; }

/* Строка фонда — фильтр списка трат (FEAT-033). Своего вида у «нажимаемости»
   нет намеренно: подчёркивания и стрелки на семи строках подряд превратили бы
   тихую колонку в панель управления. Обратная связь — отклик на нажатие,
   а результат виден сразу под фондами. */
.fund[role="button"] {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 120ms ease;
}
.fund[role="button"]:active { opacity: 0.5; }

/* Выбранный фонд. Метка — засечка на полях слева, как галочка карандашом
   на бумаге; заливкой строки пришлось бы вводить второй фон и спорить
   с линовкой. */
.fund.picked { position: relative; }
.fund.picked::before {
  content: '';
  position: absolute;
  left: -10px;
  top: 50%;
  width: 2px;
  height: 18px;
  margin-top: -9px;
  border-radius: 1px;
  background: var(--ink-soft);
}
.fund.picked .fund-name { font-weight: 500; }
.fund-sum {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.fund-sum.negative { color: var(--brick); }
.fund-sum.zero     { color: var(--ink-ghost); }

/* Разворот. Строка того же роста, что и фонд, но тише чернилами: это не
   запись леджера, а корешок страницы. Суммы здесь намеренно нет — иначе
   строка читается как ещё один фонд, и разворачивать её незачем.
   Границы своей не имеет: сверху её рисует border-bottom последнего фонда. */
.fund-more {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  width: 100%;
  min-height: 44px;
  padding: var(--s3) 0;
  appearance: none;
  border: none;
  background: transparent;
  color: var(--ink-faint);
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: color 120ms ease;
}
.fund-more:active { color: var(--ink-soft); }

.fund-caret {
  font-size: 10px;
  line-height: 1;
  transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1);
}
.fund-more[aria-expanded="true"] .fund-caret { transform: rotate(180deg); }

/* --- Последние траты (FEAT-033) ------------------------------------------
   Не «выписка по счёту», а память: куда ушло за последние дни. Поэтому здесь
   нет ни времени, ни источника, ни статуса — только мерчант и сумма, а дата
   вынесена в подзаголовок дня, одна на группу.

   Суммы — в валюте операции и БЕЗ пересчёта в валюту экрана: тап по валюте
   (FEAT-031) переключает фонды, где число и так оценка в долларах, а здесь
   сумма операции — факт. Знак ставим префиксом по той же причине, что у
   фондов: колонка выровнена вправо, суффикс разной ширины ($ vs ₾) рвал бы
   ряд цифр.

   Блок свёрнут по умолчанию и живёт ПОД фондами — экран открывают ради
   «сколько сегодня можно», а не ради истории.
   ------------------------------------------------------------------------ */

.tx-section { margin-top: var(--s8); }

.tx {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s4);
  min-height: 38px;          /* ниже фонда: строк много, и это не цель тапа */
  padding: var(--s2) 0;
  border-bottom: 1px solid var(--rule);
}
.tx:last-child { border-bottom: none; }

.tx-name {
  font-size: 14px;
  /* Имя мерчанта приходит из банка и бывает строкой-простынёй.
     Режем показом, а не данными: обрезать на бэкенде — значит решить за
     экран, сколько знаков влезет, не зная ширины телефона. */
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.tx-sum {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}

/* Метка фондовой траты. Такие траты не бьют по дневному бюджету, и без
   пометки «Аренда ₾1200» посреди списка искажает ощущение «сколько я
   потратил». Значок тот же, которым их помечает бот в списке «🏦 Последние». */
.tx-fund {
  margin-left: 6px;
  font-size: 11px;
  opacity: 0.55;
}

/* Подзаголовок дня. Ведёт себя как надпись на полях: мельче строк, тише
   чернилами, без линовки — иначе спорит с границами самих строк. */
.tx-day {
  margin: var(--s4) 0 var(--s1);
  font-size: 11px;
  color: var(--ink-faint);
}
.tx-day:first-child { margin-top: var(--s2); }

/* Граница зарплатного цикла. Не «фильтр», а отметка на полях: всё, что выше,
   потрачено в текущем цикле — том самом, из которого считается дневной лимит
   наверху экрана. Линия сильнее обычной линовки, подпись справа мелко. */
.tx-cycle {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin: var(--s5) 0 var(--s2);
  font-size: 11px;
  color: var(--ink-faint);
}
.tx-cycle::before {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--rule-strong);
}

/* Служебные строки блока: «Загружаю», «трат нет», отказ загрузки. Ростом
   с обычную строку, чтобы блок не прыгал при смене состояния. */
.tx-state {
  padding: var(--s3) 0;
  font-size: 13px;
  color: var(--ink-faint);
}
.tx-state .btn { margin-top: var(--s3); }

/* Сноска о неполноте. В !Транзакции попадает не всё: наличные без ручного
   ввода и медицина через страховую проходят мимо. Без оговорки список
   читается как «всё, что было со счетами», и не сходится с балансом. */
.tx-note {
  margin-top: var(--s3);
  font-size: 11px;
  line-height: 1.45;
  color: var(--ink-ghost);
}

/* --- Подвал -------------------------------------------------------------- */

.foot {
  margin-top: var(--s8);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
}
.foot-stamp { font-size: 11px; color: var(--ink-faint); }

.btn {
  appearance: none;
  border: 1px solid var(--rule-strong);
  background: transparent;
  color: var(--ink-soft);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  /* Оптическое выравнивание: слева чуть меньше из-за глифа обновления */
  padding: 9px 14px 9px 12px;
  border-radius: var(--r-sm);
  min-height: 40px;
  cursor: pointer;
  transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1),
              border-color 120ms ease,
              color 120ms ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }

/* --- Состояния ------------------------------------------------------------
   BUG-009 (дашборд): сообщение об ошибке НЕЛЬЗЯ писать в контейнер, где
   лежит форма ввода URL — оно затирает форму, и чинить становится нечем.
   Поэтому #errorBlock живёт отдельно и ничего не затирает.
   ------------------------------------------------------------------------ */

#content { animation: rise 200ms cubic-bezier(0.23, 1, 0.32, 1) both; }
@keyframes rise {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}
#content.stale { opacity: 0.45; transition: opacity 160ms ease; }

.notice {
  border: 1px solid var(--rule-strong);
  border-radius: var(--r-md);
  padding: var(--s4);
  margin-bottom: var(--s5);
  background: var(--paper-sunk);
}
.notice-title { font-size: 14px; font-weight: 600; margin-bottom: var(--s1); }
.notice-body  { font-size: 13px; color: var(--ink-soft); }
.notice-body code {
  font-family: var(--font-num);
  font-size: 12px;
  background: var(--rule);
  padding: 1px 5px;
  border-radius: 4px;
}
.notice-body p { margin: var(--s2) 0 0; }
.notice.alarm { border-color: var(--brick); }
.notice.alarm .notice-title { color: var(--brick); }

.setup-input {
  width: 100%;
  margin-top: var(--s3);
  padding: 10px var(--s3);
  min-height: 44px;
  font-family: var(--font-num);
  font-size: 12px;
  color: var(--ink);
  background: var(--paper-sunk);      /* поле «вдавлено», а не приподнято */
  border: 1px solid var(--rule-strong);
  border-radius: var(--r-sm);
}
.setup-input:focus {
  outline: none;
  border-color: var(--ink-faint);
}

.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- Ошибки живут ОТДЕЛЬНО от содержимого и от формы настройки (BUG-009) -->
<div id="errorBlock" class="hidden"></div>
<div id="setupBlock" class="hidden"></div>

<div id="content" class="hidden">
  <header class="head">
    <span class="head-title">Бюджет</span>
    <span class="head-cycle" id="cycle"></span>
  </header>

  <section class="hero">
    <span class="hero-value num" id="perDay" role="button" tabindex="0">—</span>
    <div class="hero-label">доступно в день</div>
    <div class="hero-math" id="math"></div>

    <div class="gauge" id="gauge">
      <div class="gauge-top">
        <span class="gauge-plan" id="gaugePlan"></span>
      </div>
      <div class="gauge-track">
        <div class="gauge-line"></div>
        <div class="gauge-zero"></div>
        <div class="gauge-mark" id="gaugeMark" style="left:50%"></div>
      </div>
      <div class="gauge-bottom">
        <span class="gauge-delta" id="gaugeDelta"></span>
      </div>
    </div>
  </section>

  <section>
    <div class="section-head">
      <span class="section-title">Фонды</span>
      <button class="section-note" id="curNote" type="button">в долларах</button>
    </div>
    <div id="funds"></div>
  </section>

  <!-- FEAT-033: последние траты. Свёрнуто по умолчанию; подпись справа —
       она же переключатель, она же индикатор загрузки и отказа. -->
  <section class="tx-section">
    <div class="section-head">
      <span class="section-title" id="txTitle">Последние траты</span>
      <button class="section-note" id="txToggle" type="button">показать</button>
    </div>
    <div id="txBody" class="hidden"></div>
  </section>

  <footer class="foot">
    <span class="foot-stamp" id="stamp"></span>
    <button class="btn" id="refresh" type="button">↻ Обновить</button>
  </footer>
</div>

<script>
/* ===========================================================================
   Money Bot Mini App — клиент

   Данные берём из Apps Script через JSONP (как expense_dashboard.html):
   обычный fetch упрётся в CORS, а тег <script> — нет.

   Авторизация — подпись Telegram (initData), НЕ общий ключ: страница
   статическая и лежит на публичном хостинге, ключ утёк бы в исходник.
   Проверку делает phase16_miniapp.js на стороне Apps Script.
   =========================================================================== */

var API_URL_PLACEHOLDER = '__PASTE_WEB_APP_URL__';

/* Адрес веб-приложения Apps Script. Пока не прошит — берём из localStorage,
   куда его кладёт форма настройки ниже. */
var API_URL = API_URL_PLACEHOLDER;

var LS_URL   = 'miniapp_api_url';
var LS_CACHE = 'miniapp_last_payload';

var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

/* --- Тема ----------------------------------------------------------------
   Telegram решает светло/темно, значения бумаги и чернил — наши.
   Хром телеграма подкрашиваем ПОД страницу, а не наоборот. */
function applyTheme() {
  var dark = tg ? (tg.colorScheme === 'dark')
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', dark);

  if (tg) {
    var paper = getComputedStyle(document.documentElement)
                  .getPropertyValue('--paper').trim();
    try { tg.setBackgroundColor(paper); } catch (e) {}
    try { tg.setHeaderColor(paper); } catch (e) {}
  }
}

/* --- Форматирование ------------------------------------------------------- */

var MINUS = '−';   /* U+2212, а не дефис: у типографского минуса своя ширина */

/* --- Валюта экрана --------------------------------------------------------
   Числа с бэкенда ВСЕГДА в долларах — доллар здесь базовая валюта учёта.
   Тап переключает только ПОКАЗ: $ → € → ₽ → $. Никакой арифметики бюджета
   это не трогает, шкала и остаток считаются в долларах и конвертируются
   в последний момент, при выводе.

   Курсы приходят из строки 26 главного листа — те же, которыми лист считает
   ИТОГ$. Свои брать неоткуда и не нужно: иначе экран показывал бы не то,
   что таблица.

   Знак ставим ПРЕФИКСОМ у всех трёх, включая рубль. По-русски привычнее
   «4 564 ₽», но колонка фондов выровнена по правому краю: суффикс сдвигал бы
   цифры на ширину знака, и ровная колонка развалилась бы при каждом тапе.

   Выбор НЕ запоминается между открытиями — экран всегда открывается
   в долларах. Иначе через месяц рублёвое число читалось бы как долларовое. */
var CURRENCIES = [
  { code: 'USD', sign: '$', note: 'в долларах' },
  { code: 'EUR', sign: '€', note: 'в евро'     },
  { code: 'RUB', sign: '₽', note: 'в рублях'   }
];

var curRates = { USD: 1 };
var curCycle = [CURRENCIES[0]];
var curIdx   = 0;

function activeCur() { return curCycle[curIdx]; }

/* Валюта без курса в цикл НЕ попадает.
   Подставить единицу вместо пустого курса — значит показать долларовые числа
   со значком евро: молча и уверенно неверно. Пусть лучше валюты не будет. */
function setRates(rates) {
  curRates = { USD: 1 };
  CURRENCIES.forEach(function (c) {
    if (c.code === 'USD') return;
    var r = Number(rates && rates[c.code]);
    if (isFinite(r) && r > 0) curRates[c.code] = r;
  });
  curCycle = CURRENCIES.filter(function (c) { return curRates[c.code]; });
  if (curIdx >= curCycle.length) curIdx = 0;
}

function toActive(usd) {
  return (Number(usd) || 0) * curRates[activeCur().code];
}

/* Текстовый вариант — для подписей обычным шрифтом. */
function money(n) {
  var v = Math.round(toActive(n));
  return (v < 0 ? MINUS : '') + activeCur().sign + Math.abs(v).toLocaleString('ru-RU');
}

/* Вариант для моноширинных мест: разделитель разрядов рисуем сами (.gsep),
   иначе он занимает полную ширину знака и число зияет дырой.
   Внутри только цифры и наша разметка — чужих строк здесь не бывает. */
function moneyHtml(n) {
  var v = Math.round(toActive(n));
  var body = Math.abs(v).toLocaleString('ru-RU')
               .replace(/[    ]/g, '<i class="gsep"></i>');
  return (v < 0 ? MINUS : '') + activeCur().sign + body;
}

function plural(n, one, few, many) {
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5)   return few;
  if (b === 1)          return one;
  return many;
}

function timeStamp(iso) {
  var d = iso ? new Date(iso) : new Date();
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

/* --- Отрисовка ------------------------------------------------------------ */

/* Последнее показанное — чтобы тап по валюте перерисовал экран, не ходя
   заново в сеть: конвертация целиком на клиенте, данные те же. */
var lastData = null, lastStale = false;

function render(data, isStale) {
  lastData  = data;
  lastStale = !!isStale;
  setRates(data.rates);

  var content = document.getElementById('content');
  content.classList.remove('hidden');
  content.classList.toggle('stale', !!isStale);

  var days = Number(data.daysLeft) || 0;
  document.getElementById('cycle').textContent =
    days > 0 ? days + ' ' + plural(days, 'день', 'дня', 'дней') + ' до зарплаты' : '';

  document.getElementById('perDay').innerHTML = moneyHtml(data.perDay);

  /* Арифметика числа — подпись продукта: видно, ОТКУДА взялся лимит */
  var math = document.getElementById('math');
  math.textContent = days > 0
    ? money(data.remainder) + ' остатка ÷ ' + days + ' ' + plural(days, 'день', 'дня', 'дней')
    : money(data.remainder) + ' остатка';

  renderGauge(Number(data.perDay) || 0, Number(data.planPerDay) || 0);
  renderFunds(data.funds || []);
  renderCurNote();
  renderTx();   /* сам список от валюты экрана не зависит — перерисовываем ради
                   заголовка с фильтром и подписи «показать/скрыть» */

  document.getElementById('stamp').textContent =
    (isStale ? 'из памяти · ' : 'обновлено ') + timeStamp(data.updatedAt);
}

/* Подпись у заголовка «Фонды» — она же переключатель и она же ответ на
   вопрос «а это сейчас в чём». Пунктир говорит, что по ней можно нажать;
   когда переключать не на что (курсов не пришло), пунктир снимается —
   мёртвая на вид кнопка честнее живой на вид, но неработающей. */
function renderCurNote() {
  var note = document.getElementById('curNote');
  var only = curCycle.length < 2;
  note.textContent = activeCur().note;
  note.disabled = only;
  note.setAttribute('title', only ? 'Курсы не пришли — переключать не на что' : '');
}

function cycleCurrency() {
  if (curCycle.length < 2 || !lastData) return;
  curIdx = (curIdx + 1) % curCycle.length;
  render(lastData, lastStale);
  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
  }
}

/* Шкала отклонения: план — ноль в центре, факт — засечка слева или справа.
   Отклонение прижимаем к ±50% плана, чтобы засечка не улетала за край,
   а подпись под ней — к 12..88%, чтобы не обрезалась о край экрана. */
function renderGauge(fact, plan) {
  var gauge = document.getElementById('gauge');
  if (!plan) { gauge.classList.add('hidden'); return; }
  gauge.classList.remove('hidden');

  var delta  = fact - plan;
  var ratio  = Math.max(-0.5, Math.min(0.5, delta / plan));
  var markPc = 50 + ratio * 100;
  var behind = delta < 0;

  var mark = document.getElementById('gaugeMark');
  mark.style.left = markPc + '%';
  mark.classList.toggle('behind', behind);

  document.getElementById('gaugePlan').textContent = 'план ' + money(plan);

  var d = document.getElementById('gaugeDelta');
  if (Math.abs(delta) < 1) {
    d.textContent = 'ровно по плану';
    d.className = 'gauge-delta';
    d.style.left = '50%';
  } else {
    d.textContent = (behind ? MINUS : '+') + money(Math.abs(delta)).replace(MINUS, '');
    d.className = 'gauge-delta ' + (behind ? 'behind' : 'ahead');
    d.style.left = Math.max(12, Math.min(88, markPc)) + '%';
  }
}

/* --- Раскладка фондов -----------------------------------------------------
   Порядок на экране — СВОЙ, не табличный. В таблице строки 13–22 стоят так,
   как удобно формулам; здесь нужен порядок по вниманию: сначала то, из чего
   тратят в этом месяце.

   Списки живут на странице, а не в Apps Script, намеренно. Это экранная
   раскладка: она меняется вместе с приоритетами (раз в месяц-два), и менять
   её не должно стоить редеплоя веб-приложения — достаточно deploy_miniapp.sh.
   В Apps Script остаётся только СМЫСЛОВОЕ отсеивание (MINIAPP_HIDDEN_FUNDS):
   «Тани» — транзитный карман, «Страховая» — клиринг долга, они не фонды
   вообще. «Квартира» же — обычный фонд, просто сейчас не нужна на глазах,
   и это решение экрана, а не модели данных.                                 */
var FUND_PRIMARY   = ['Отпуск', 'Техника', 'Бадди', 'Мама'];
var FUND_SECONDARY = ['Мои', 'Депозит', 'Подушка'];
var FUND_HIDDEN    = ['Квартира'];

/* Разворот держим в памяти страницы: «Обновить» не должен схлопывать то,
   что человек только что открыл. Между запусками не помним — экран
   открывают ради первых четырёх строк. */
var fundsExpanded = false;

function fundKey(name) { return String(name || '').trim().toLowerCase(); }

function arrangeFunds(funds) {
  var byKey = {};
  funds.forEach(function (f) { byKey[fundKey(f.name)] = f; });

  var used = {};
  function take(names) {
    var out = [];
    names.forEach(function (n) {
      var k = fundKey(n);
      if (byKey[k]) { out.push(byKey[k]); used[k] = true; }
    });
    return out;
  }

  var top  = take(FUND_PRIMARY);
  var rest = take(FUND_SECONDARY);
  FUND_HIDDEN.forEach(function (n) { used[fundKey(n)] = true; });

  /* Фонд, которого нет ни в одном списке, — новая строка в таблице.
     Кладём его в разворот, а не прячем: лишняя строка видна сразу,
     пропавшее число ищут долго. */
  funds.forEach(function (f) {
    if (!used[fundKey(f.name)]) rest.push(f);
  });

  return { top: top, rest: rest };
}

function fundRow(f) {
  var row = document.createElement('div');
  row.className = 'fund' + (txFund === f.name ? ' picked' : '');

  /* FEAT-033: строка фонда фильтрует список трат под фондами. Верх экрана
     тап не трогает: perDay и шкала считаются по циклу целиком, и дёргать их
     от фильтра значило бы показать «дневной лимит фонда», которого нет. */
  row.setAttribute('role', 'button');
  row.tabIndex = 0;
  row.addEventListener('click', function () { pickTxFund(f.name); });
  row.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pickTxFund(f.name); }
  });

  var name = document.createElement('span');
  name.className = 'fund-name';
  name.textContent = f.name;            /* имя из таблицы — только textContent */

  var sum = document.createElement('span');
  sum.className = 'fund-sum';
  if (f.usd < 0)   sum.classList.add('negative');
  else if (!f.usd) sum.classList.add('zero');
  sum.innerHTML = moneyHtml(f.usd);

  row.appendChild(name);
  row.appendChild(sum);
  return row;
}

function renderFunds(funds) {
  var box = document.getElementById('funds');
  box.textContent = '';

  var split = arrangeFunds(funds || []);

  if (!split.top.length && !split.rest.length) {
    var empty = document.createElement('div');
    empty.className = 'fund';
    var msg = document.createElement('span');
    msg.className = 'fund-name';
    msg.style.color = 'var(--ink-faint)';
    msg.textContent = 'Фондов нет';
    empty.appendChild(msg);
    box.appendChild(empty);
    return;
  }

  split.top.forEach(function (f) { box.appendChild(fundRow(f)); });

  if (!split.rest.length) return;

  /* Свёрнутые строки строим сразу и прячем классом, а не пересобираем по
     клику: пересборка теряет фокус на кнопке и роняет анимацию стрелки. */
  var more = document.createElement('div');
  split.rest.forEach(function (f) { more.appendChild(fundRow(f)); });

  var label = document.createElement('span');
  label.textContent = 'Ещё ' + split.rest.length + ' ' +
    plural(split.rest.length, 'фонд', 'фонда', 'фондов');

  var caret = document.createElement('span');
  caret.className = 'fund-caret';
  caret.textContent = '▾';

  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'fund-more';
  btn.appendChild(label);
  btn.appendChild(caret);

  function sync() {
    btn.setAttribute('aria-expanded', fundsExpanded ? 'true' : 'false');
    more.className = fundsExpanded ? '' : 'hidden';
  }
  sync();

  btn.addEventListener('click', function () {
    fundsExpanded = !fundsExpanded;
    sync();
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    }
  });

  box.appendChild(btn);
  box.appendChild(more);
}

/* --- Последние траты (FEAT-033) -------------------------------------------
   Задача блока — память: куда ушли деньги за последние дни. Не сверка
   («правильно ли бот записал» — там нужны время и источник) и не правка
   («повесить фонд задним числом» — это живёт в боте, FEAT-022). Экран
   остаётся read-only.

   Окно НЕ равно видимому: с бэкенда приходит 200 трат, показываем 10.
   Так фильтр по фонду работает мгновенно и на клиенте — иначе каждый тап
   стоил бы похода в Apps Script, а по редкому фонду короткое окно дало бы
   одну запись и соврало бы «трат не было».                                 */

var TX_FIRST = 10;   /* сколько строк видно сразу */
var TX_STEP  = 10;   /* сколько добавляет «Ещё» */

/* Фонды, из которых не тратят вообще: Депозит и Подушка — резервы, бот
   в них только откладывает. Пустой список по ним — не «данных нет», а «здесь
   трат не бывает», и сказать это надо словами, иначе пустота читается сбоем.
   Источник истины — SPEND_FUNDS в phase6_fund.js; здесь список продублирован
   осознанно, как FUND_PRIMARY выше: это текст экрана, а не модель. */
var TX_NEVER_SPENT = ['Депозит', 'Подушка'];

var TX_SIGN = { USD: '$', EUR: '€', RUB: '₽', GEL: '₾', KZT: '₸' };

var txState      = 'idle';   /* idle | loading | ready | error */
var txItems      = [];
var txCycleStart = 0;
var txErrorText  = '';
var txExpanded   = false;
var txShown      = TX_FIRST;
var txFund       = null;     /* активный фильтр по фонду */
var txRefocus    = false;    /* вернуть фокус на «Ещё» после дорисовки */

/* --- Чистые помощники (покрыты test_miniapp_tx.js) --- */

/* Незнакомый код валюты показываем кодом, а не подставляем доллар:
   «$250» вместо «250 DKK» — молча и уверенно неверно. FX-слой (FEAT-025)
   позволяет тратить в любой валюте, справочник !Курсы правится без деплоя,
   и новый код доедет сюда раньше, чем эта таблица.

   Отбивку от числа знак НЕ несёт: в моноширинном шрифте пробел занимает
   полную ширину знака, и «DKK 85» зияет дырой. Щель рисует .gsep в разметке. */
function txSign(code) {
  var c = String(code || '').toUpperCase();
  return TX_SIGN[c] || c;
}

/* Суммы целые: экран про «куда ушло», а не про сверку до цента. Исключение —
   траты меньше единицы валюты: округление показало бы «₾0», то есть трату,
   которой как будто не было. */
function txAmountText(n) {
  var v = Number(n) || 0;
  if (v !== 0 && Math.abs(v) < 1) return String(v.toFixed(1)).replace('.', ',');
  return Math.round(v).toLocaleString('ru-RU');
}

/* Разделитель разрядов рисуем сами, как в moneyHtml: в моноширинном шрифте
   любой пробельный символ занимает полную ширину знака, и «₾1 200» зияет
   дырой. Внутри только наши цифры и наша разметка — чужих строк не бывает,
   знак валюты приклеивается отдельным текстовым узлом. */
function txAmountHtml(n) {
  return txAmountText(n).replace(/[   ]/g, '<i class="gsep"></i>');
}

function txDayStamp(ts) {
  var d = new Date(ts);
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

/* Месяцы своей таблицей, а не toLocaleDateString: движки расходятся в том,
   что считать сокращением. WebKit (вебвью Telegram) на июле отдаёт полное
   «24 июля», а на августе сокращённое «21 авг» — на одном экране это читается
   как небрежность. Заодно исчезает разница между тем, что видит браузер
   на телефоне, и тем, что проверяет Node в тестах. */
var TX_MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн',
                 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

function txShortDate(ts) {
  var d = new Date(ts);
  return d.getDate() + ' ' + TX_MONTHS[d.getMonth()];
}

/* «Вчера» считаем сдвигом календарного дня, а не вычитанием суток в
   миллисекундах: в поездке (Копенгаген) перевод часов сделал бы вчерашний
   день позавчерашним на один день в году. */
function txDayLabel(ts, nowTs) {
  if (!ts) return 'без даты';
  var day = txDayStamp(ts);
  if (day === txDayStamp(nowTs)) return 'Сегодня';

  var y = new Date(nowTs);
  y.setDate(y.getDate() - 1);
  if (day === txDayStamp(y.getTime())) return 'Вчера';

  return txShortDate(ts);
}

/* Индекс первой траты ПРОШЛОГО цикла — там и рисуем границу. −1 = все
   показанные траты из текущего цикла, границы в окне нет. */
function txCycleSplit(items, cycleStart) {
  if (!cycleStart) return -1;
  for (var i = 0; i < items.length; i++) {
    if (items[i].ts && items[i].ts < cycleStart) return i;
  }
  return -1;
}

function txFilterByFund(items, fund) {
  if (!fund) return items;
  return items.filter(function (it) { return it.fund === fund; });
}

/* --- Отрисовка блока --- */

function txRowNode(it) {
  var row = document.createElement('div');
  row.className = 'tx';

  var name = document.createElement('span');
  name.className = 'tx-name';
  name.textContent = it.merchant || '—';   /* строка от банка — только textContent */

  /* Метку ставим только в общем списке: когда фильтр уже по фонду,
     она стоит у каждой строки и не значит ничего. */
  if (it.fund && !txFund) {
    var mark = document.createElement('span');
    mark.className = 'tx-fund';
    mark.textContent = '🏦';
    mark.title = it.fund;
    name.appendChild(mark);
  }

  /* Знак валюты — текстовым узлом, число — разметкой: код валюты приходит
     из таблицы, и склеивать его с HTML незачем. */
  var sum = document.createElement('span');
  sum.className = 'tx-sum num';

  var sign = txSign(it.currency);
  sum.appendChild(document.createTextNode(sign));

  /* Односимвольный знак ($, ₾) прижимается к числу вплотную, буквенный код
     (DKK) — через узкую щель, иначе «DKK85» слипается. Пробелом её ставить
     нельзя, см. txSign. */
  if (sign.length > 1) {
    var gap = document.createElement('i');
    gap.className = 'gsep';
    sum.appendChild(gap);
  }

  var val = document.createElement('span');
  val.innerHTML = txAmountHtml(it.amount);
  sum.appendChild(val);

  row.appendChild(name);
  row.appendChild(sum);
  return row;
}

function txStateNode(text, withRetry) {
  var box = document.createElement('div');
  box.className = 'tx-state';

  var msg = document.createElement('div');
  msg.textContent = text;
  box.appendChild(msg);

  if (withRetry) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = '↻ Повторить';
    btn.addEventListener('click', loadTx);
    box.appendChild(btn);
  }
  return box;
}

function renderTx() {
  var toggle = document.getElementById('txToggle');
  var title  = document.getElementById('txTitle');
  var box    = document.getElementById('txBody');

  /* Подпись справа — единственное место, где отказ загрузки виден, пока блок
     свёрнут. Молчать нельзя: фоновая загрузка, которая тихо не сработала,
     выглядит как «трат просто нет». */
  toggle.textContent = txExpanded ? 'скрыть'
                     : (txState === 'error' ? 'не загрузились' : 'показать');
  toggle.setAttribute('aria-expanded', txExpanded ? 'true' : 'false');

  title.textContent = txFund ? 'Траты · ' + txFund : 'Последние траты';

  box.className = txExpanded ? '' : 'hidden';
  box.textContent = '';
  if (!txExpanded) return;

  if (txState === 'loading' || txState === 'idle') {
    box.appendChild(txStateNode('Загружаю…', false));
    return;
  }
  if (txState === 'error') {
    box.appendChild(txStateNode(txErrorText || 'Траты не загрузились.', true));
    return;
  }

  var list = txFilterByFund(txItems, txFund);

  if (!list.length) {
    if (txFund && TX_NEVER_SPENT.indexOf(txFund) !== -1) {
      box.appendChild(txStateNode('Из этого фонда не тратим — он на сбережения.', false));
    } else if (txFund) {
      box.appendChild(txStateNode('Среди последних трат по этому фонду ничего нет.', false));
    } else {
      box.appendChild(txStateNode('Пока пусто.', false));
    }
    box.appendChild(txNoteNode());
    return;
  }

  var visible = list.slice(0, txShown);
  var splitAt = txCycleSplit(visible, txCycleStart);
  var now     = Date.now();
  var lastDay = null;

  for (var i = 0; i < visible.length; i++) {
    /* Граница цикла крупнее границы дня, поэтому идёт перед заголовком дня. */
    if (i === splitAt) {
      var sep = document.createElement('div');
      sep.className = 'tx-cycle';
      var when = document.createElement('span');
      when.textContent = txShortDate(txCycleStart) + ' · начало цикла';
      sep.appendChild(when);
      box.appendChild(sep);
      lastDay = null;
    }

    var label = txDayLabel(visible[i].ts, now);
    if (label !== lastDay) {
      var head = document.createElement('div');
      head.className = 'tx-day';
      head.textContent = label;
      box.appendChild(head);
      lastDay = label;
    }

    box.appendChild(txRowNode(visible[i]));
  }

  if (list.length > txShown) {
    var left = list.length - txShown;
    var step = Math.min(TX_STEP, left);

    var lbl = document.createElement('span');
    lbl.textContent = 'Ещё ' + step;

    var caret = document.createElement('span');
    caret.className = 'fund-caret';
    caret.textContent = '▾';

    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'fund-more';
    more.appendChild(lbl);
    more.appendChild(caret);
    more.addEventListener('click', function () {
      txShown += TX_STEP;
      txRefocus = true;          /* список дорисовывается — кнопка уезжает вниз */
      renderTx();
    });
    box.appendChild(more);

    if (txRefocus) { txRefocus = false; try { more.focus(); } catch (e) {} }
  } else {
    txRefocus = false;
  }

  box.appendChild(txNoteNode());
}

/* Сноска о неполноте журнала. Живёт под списком, а не над ним: это оговорка,
   а не предупреждение, и открывают блок ради строк, а не ради неё. */
function txNoteNode() {
  var note = document.createElement('div');
  note.className = 'tx-note';
  note.textContent = 'Только траты, записанные автоматически или вручную ' +
                     'через бота. Наличные мимо бота и медицина через страховую сюда не попадают.';
  return note;
}

function haptic() {
  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
  }
}

function toggleTxSection() {
  txExpanded = !txExpanded;
  renderTx();
  haptic();
}

/* Тап по фонду: ставит фильтр и разворачивает блок. Повторный тап по тому же
   фонду снимает фильтр, но блок оставляет открытым — свернуть его обратно
   значило бы наказать за любопытство. */
function pickTxFund(name) {
  txFund   = (txFund === name) ? null : name;
  txShown  = TX_FIRST;
  txExpanded = true;
  renderFunds(lastData && lastData.funds ? lastData.funds : []);
  renderTx();
  haptic();
}

/* Отдельный запрос, фоном, после того как экран уже нарисован. В localStorage
   НЕ кладём: кеш там держит числа для холодного старта, а список трат — вещь
   второстепенная, ради неё раздувать сохранённый payload незачем.

   Запасного пути нет намеренно. Не сработало — блок скажет об этом и даст
   «Повторить»; тихая догрузка по требованию замаскировала бы мёртвый
   prefetch, и мы бы о нём не узнали. */
function loadTx() {
  txState = 'loading';
  renderTx();

  var initData = tg && tg.initData ? tg.initData : '';

  jsonp(API_URL, { initData: initData, part: 'tx' }, function (data) {
    if (data && data.error) {
      txState = 'error';
      txErrorText = reasonMessage(data.reason).title + '. Траты не загрузились.';
      renderTx();
      return;
    }
    if (!data || !data.tx) {
      txState = 'error';
      txErrorText = 'Apps Script ответил, но трат не прислал.';
      renderTx();
      return;
    }

    txItems      = data.tx;
    txCycleStart = Number(data.cycleStart) || 0;
    txState      = 'ready';
    renderTx();

  }, function (kind) {
    txState = 'error';
    txErrorText = kind === 'timeout' ? 'Список трат не дождались.'
                                     : 'Список трат не загрузился.';
    renderTx();
  });
}

/* --- Сообщения ------------------------------------------------------------ */

/* Кнопка повтора живёт В САМОМ сообщении, а не только в подвале.
   Подвал лежит внутри #content, а он скрыт, пока данных не было ни разу —
   тогда текст «нажмите Обновить» указывал бы на кнопку, которой на экране
   нет. Тупик того же рода, что BUG-009 на дашборде. */
function showError(title, bodyHtml, alarm) {
  var box = document.getElementById('errorBlock');
  box.className = 'notice' + (alarm ? ' alarm' : '');
  box.innerHTML =
    '<div class="notice-title"></div>' +
    '<div class="notice-body"></div>' +
    '<div style="margin-top:14px"><button class="btn" id="retryBtn" type="button">↻ Повторить</button></div>';
  box.querySelector('.notice-title').textContent = title;
  box.querySelector('.notice-body').innerHTML = bodyHtml;
  document.getElementById('retryBtn').addEventListener('click', load);
}
function clearError() {
  var box = document.getElementById('errorBlock');
  box.className = 'hidden';
  box.textContent = '';
}

/* Форма ввода адреса. Отдельный блок — ошибки её не затирают (BUG-009). */
function showSetup(currentUrl) {
  var box = document.getElementById('setupBlock');
  box.className = 'notice';
  box.innerHTML =
    '<div class="notice-title">Адрес веб-приложения</div>' +
    '<div class="notice-body">Ссылка вида <code>…/exec</code> из Apps Script → Развернуть. ' +
    'Ключ <code>?key=</code> добавлять не нужно — мини-апп ходит по подписи Telegram.</div>' +
    '<input class="setup-input" id="apiInput" placeholder="https://script.google.com/macros/s/…/exec" ' +
    'autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div style="margin-top:12px"><button class="btn" id="apiSave" type="button">Сохранить</button></div>';

  var input = document.getElementById('apiInput');
  input.value = currentUrl || '';
  document.getElementById('apiSave').addEventListener('click', function () {
    var v = input.value.trim();
    if (!v) return;
    localStorage.setItem(LS_URL, v);
    API_URL = v;
    box.className = 'hidden';
    box.textContent = '';
    load();
  });
}

/* --- Транспорт ------------------------------------------------------------ */

var jsonpSeq = 0;

function jsonp(url, params, onDone, onFail) {
  var name = 'miniappCb' + (++jsonpSeq) + '_' + Date.now();
  var script = document.createElement('script');
  var timer;

  function cleanup() {
    clearTimeout(timer);
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[name] = function (data) { cleanup(); onDone(data); };

  timer = setTimeout(function () { cleanup(); onFail('timeout'); }, 15000);
  script.onerror = function () { cleanup(); onFail('network'); };

  var qs = ['action=miniapp', 'callback=' + name];
  for (var k in params) qs.push(k + '=' + encodeURIComponent(params[k]));
  script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + qs.join('&');
  document.body.appendChild(script);
}

/* --- Загрузка ------------------------------------------------------------- */

function reasonMessage(reason) {
  if (reason === 'owner_not_set') {
    return {
      title: 'Остался один шаг',
      body: 'Подпись Telegram сошлась, но владелец мини-аппа ещё не назначен. ' +
            'Откройте редактор Apps Script и запустите функцию ' +
            '<code>approveLastMiniAppUser</code> — она возьмёт ваш id из этого входа.' +
            '<p>После этого вернитесь сюда и нажмите «Повторить».</p>',
      alarm: false
    };
  }
  if (reason === 'foreign_user') {
    return { title: 'Доступ закрыт',
             body: 'Этот аккаунт Telegram не назначен владельцем.', alarm: true };
  }
  if (reason === 'expired') {
    return { title: 'Подпись устарела',
             body: 'Закройте мини-апп и откройте заново — Telegram выдаст свежую подпись.',
             alarm: false };
  }
  if (reason === 'no_token') {
    return { title: 'Бот не настроен',
             body: 'В Script Properties нет <code>BOT_TOKEN</code>.', alarm: true };
  }
  if (reason === 'malformed' || reason === 'no_user') {
    return {
      title: 'Нет подписи Telegram',
      body: 'Страница открыта не из Telegram — тогда подписи взяться неоткуда. ' +
            'Откройте мини-апп через бота.',
      alarm: false
    };
  }
  return { title: 'Доступ закрыт',
           body: 'Причина: <code>' + (reason || 'неизвестна') + '</code>', alarm: true };
}

function readCache() {
  try { return JSON.parse(localStorage.getItem(LS_CACHE) || 'null'); }
  catch (e) { return null; }
}

function load() {
  var btn = document.getElementById('refresh');
  btn.disabled = true;

  var initData = tg && tg.initData ? tg.initData : '';

  jsonp(API_URL, { initData: initData }, function (data) {
    btn.disabled = false;

    if (data && data.error) {
      var m = reasonMessage(data.reason);
      showError(m.title, m.body, m.alarm);
      var cached = readCache();
      if (cached) render(cached, true);
      return;
    }
    if (!data || typeof data.perDay === 'undefined') {
      showError('Пустой ответ', 'Apps Script ответил, но данных не прислал.', true);
      return;
    }

    clearError();
    localStorage.setItem(LS_CACHE, JSON.stringify(data));
    render(data, false);
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    }

    /* FEAT-033: список трат догружаем фоном, уже показав дневной бюджет.
       Отдельным запросом — чтение хвоста !Транзакции тяжелее четырёх getRange
       главного листа и не должно задерживать герой. */
    loadTx();

  }, function (kind) {
    btn.disabled = false;
    var cached = readCache();
    showError(
      kind === 'timeout' ? 'Долго не отвечает' : 'Не удалось соединиться',
      'Apps Script не ответил.' + (cached ? ' Ниже — последние сохранённые числа.' : '') +
      '<p>Проверьте связь и попробуйте ещё раз.</p>',
      false
    );
    if (cached) render(cached, true);
  });
}

/* --- Старт ---------------------------------------------------------------- */

(function init() {
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.onEvent('themeChanged', applyTheme); } catch (e) {}
  }
  applyTheme();

  document.getElementById('refresh').addEventListener('click', load);

  /* Две точки входа в переключение валюты, обе — «по самой валюте»:
     крупный знак у героя и подпись «в чём» над колонкой фондов. */
  document.getElementById('perDay').addEventListener('click', cycleCurrency);
  document.getElementById('curNote').addEventListener('click', cycleCurrency);

  document.getElementById('txToggle').addEventListener('click', toggleTxSection);

  var saved = localStorage.getItem(LS_URL);
  if (saved) API_URL = saved;

  /* Показываем сохранённые числа СРАЗУ: вебвью открывается «холодным»,
     и пустой экран на секунду хуже, чем слегка приглушённые прошлые данные. */
  var cached = readCache();
  if (cached) render(cached, true);

  if (!API_URL || API_URL === API_URL_PLACEHOLDER) {
    showSetup('');
    return;
  }
  load();
})();
</script>
